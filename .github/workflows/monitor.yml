name: Hurtigruten Monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Create monitor
        run: |
          cat > monitor.py <<'PY'
          import asyncio
          import json
          import os
          import re
          import smtplib
          from pathlib import Path
          from email.mime.text import MIMEText
          from playwright.async_api import async_playwright

          BOOKING_URL = "https://www.hurtigruten.com/en/port-to-port/booking"
          TARGET_DATE = "2027-02-07"

          ROUTES = [
              ("Svolvær", "Skjervøy"),
              ("Svolvær", "Tromsø"),
              ("Bodø", "Tromsø"),
          ]

          STATE_FILE = Path("availability_state.json")

          SMTP_USER = os.environ["SMTP_USER"]
          SMTP_PASSWORD = os.environ["SMTP_PASSWORD"]
          ALERT_EMAIL = os.environ["ALERT_EMAIL"]

          results = []
          errors = []
          network_hits = []

          def redact(s):
              if not s:
                  return ""

              s = str(s)

              s = re.sub(
                  r'([?&](?:auth|token|access_token|refresh_token|code|session)=)[^&\s]+',
                  r'\1[REDACTED]',
                  s,
                  flags=re.I
              )

              return s[:3000]

          def load_state():
              try:
                  if STATE_FILE.exists():
                      return json.loads(
                          STATE_FILE.read_text(
                              encoding="utf-8"
                          )
                      )
              except Exception:
                  pass

              return {}

          def save_state(data):
              STATE_FILE.write_text(
                  json.dumps(
                      data,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )

          async def remove_cookie(page):
              try:
                  await page.evaluate("""
                  () => {
                      for (const s of [
                          '#onetrust-banner-sdk',
                          '#onetrust-consent-sdk',
                          '.onetrust-pc-dark-filter'
                      ]) {
                          document.querySelectorAll(s)
                            .forEach(e => e.remove());
                      }

                      document.body.style.overflow = 'auto';
                  }
                  """)
              except:
                  pass

          async def get_booking_frame(page):
              """
              Find the frame containing the actual Port-to-Port
              booking controls.

              The previous diagnostic showed the real controls
              inside a frame, so never assume the main document.
              """

              for _ in range(30):
                  await page.wait_for_timeout(500)

                  frames = page.frames

                  for frame in frames:
                      try:
                          inputs = frame.locator("input")

                          if await inputs.count() == 0:
                              continue

                          visible = 0

                          for i in range(
                              min(await inputs.count(), 30)
                          ):
                              try:
                                  if await inputs.nth(i).is_visible():
                                      visible += 1
                              except:
                                  pass

                          if visible >= 2:
                              return frame

                      except:
                          pass

              raise RuntimeError(
                  "Could not find Hurtigruten booking frame"
              )

          async def get_visible_inputs(frame):
              data = await frame.locator("input").evaluate_all("""
              els => els.map((e,i) => {
                  const r = e.getBoundingClientRect();

                  return {
                      i: i,
                      type: e.type || "",
                      name: e.name || "",
                      id: e.id || "",
                      value: e.value || "",
                      placeholder: e.placeholder || "",
                      aria: e.getAttribute("aria-label") || "",
                      visible:
                          r.width > 0 &&
                          r.height > 0 &&
                          getComputedStyle(e).display !== "none" &&
                          getComputedStyle(e).visibility !== "hidden"
                  };
              })
              """)

              return [
                  x for x in data
                  if x["visible"]
              ]

          async def select_port(frame, index, port):
              inputs = frame.locator("input")
              el = inputs.nth(index)

              await el.click()
              await el.press("Control+A")
              await el.fill(port)

              await frame.wait_for_timeout(700)

              # Exact option.
              option = frame.get_by_text(
                  port,
                  exact=True
              )

              for i in range(await option.count()):
                  try:
                      item = option.nth(i)

                      if await item.is_visible():
                          await item.click()
                          await frame.wait_for_timeout(500)
                          return True
                  except:
                      pass

              # ARIA option.
              option = frame.locator(
                  '[role="option"]'
              )

              for i in range(await option.count()):
                  try:
                      item = option.nth(i)

                      if not await item.is_visible():
                          continue

                      text = (
                          await item.inner_text()
                      ).strip()

                      if port.lower() in text.lower():
                          await item.click()
                          await frame.wait_for_timeout(500)
                          return True
                  except:
                      pass

              # Keyboard fallback.
              await el.press("Enter")
              await frame.wait_for_timeout(500)

              return True

          async def set_ports(frame, origin, destination):
              inputs = await get_visible_inputs(frame)

              print(
                  "VISIBLE INPUTS:",
                  json.dumps(
                      inputs,
                      ensure_ascii=False
                  )
              )

              # Identify port fields from their actual values,
              # names, placeholders, or position.
              candidates = []

              for x in inputs:
                  typ = x["type"].lower()

                  if typ in (
                      "text",
                      "search",
                      ""
                  ):
                      candidates.append(x)

              if len(candidates) < 2:
                  raise RuntimeError(
                      "Booking frame found, but fewer than "
                      "two visible port inputs exist"
                  )

              # Use the first two suitable fields.
              first = candidates[0]["i"]
              second = candidates[1]["i"]

              await select_port(
                  frame,
                  first,
                  origin
              )

              await frame.wait_for_timeout(700)

              # React can replace the inputs.
              inputs = await get_visible_inputs(frame)

              candidates = [
                  x for x in inputs
                  if x["type"].lower()
                  in ("text", "search", "")
              ]

              if len(candidates) < 2:
                  raise RuntimeError(
                      "Destination field disappeared"
                  )

              await select_port(
                  frame,
                  candidates[1]["i"],
                  destination
              )

          async def set_date(frame):
              inputs = await get_visible_inputs(frame)

              print(
                  "DATE SEARCH INPUTS:",
                  json.dumps(
                      inputs,
                      ensure_ascii=False
                  )
              )

              candidate = None

              # Actual date input.
              for x in inputs:
                  if x["type"].lower() == "date":
                      candidate = x
                      break

              # Date-related attributes.
              if candidate is None:
                  for x in inputs:
                      hay = " ".join([
                          x["name"],
                          x["id"],
                          x["placeholder"],
                          x["aria"]
                      ]).lower()

                      if (
                          "date" in hay
                          or "departure" in hay
                      ):
                          candidate = x
                          break

              # Date-like current value.
              if candidate is None:
                  for x in inputs:
                      if re.match(
                          r"^\d{1,2}[/-]\d{1,2}[/-]\d{2,4}$",
                          x["value"]
                      ):
                          candidate = x
                          break

              if candidate is None:
                  raise RuntimeError(
                      "Could not find departure date input "
                      "inside booking frame"
                  )

              el = frame.locator(
                  "input"
              ).nth(candidate["i"])

              print(
                  "DATE CONTROL:",
                  candidate
              )

              # Native date input.
              if candidate["type"].lower() == "date":
                  await el.fill(TARGET_DATE)
                  await el.dispatch_event("input")
                  await el.dispatch_event("change")
                  await el.press("Tab")
                  return True

              # React-compatible native setter.
              result = await el.evaluate(
                  """(el, value) => {
                      const proto =
                        Object.getPrototypeOf(el);

                      const descriptor =
                        Object.getOwnPropertyDescriptor(
                          proto,
                          'value'
                        );

                      if (descriptor &&
                          descriptor.set) {
                          descriptor.set.call(
                            el,
                            value
                          );
                      } else {
                          el.value = value;
                      }

                      el.dispatchEvent(
                        new Event(
                          'input',
                          {bubbles:true}
                        )
                      );

                      el.dispatchEvent(
                        new Event(
                          'change',
                          {bubbles:true}
                        )
                      );

                      return el.value;
                  }""",
                  TARGET_DATE
              )

              print(
                  "DATE SET RESULT:",
                  result
              )

              await el.press("Tab")
              await frame.wait_for_timeout(500)

              return bool(result)

          async def get_buttons(frame):
              return await frame.locator(
                  "button"
              ).evaluate_all("""
              els => els.map((e,i) => {
                  const r=e.getBoundingClientRect();

                  return {
                      i,
                      text:(e.innerText || '').trim(),
                      aria:e.getAttribute('aria-label') || '',
                      type:e.type || '',
                      visible:
                          r.width > 0 &&
                          r.height > 0 &&
                          getComputedStyle(e).display !== 'none' &&
                          getComputedStyle(e).visibility !== 'hidden'
                  };
              }).filter(x => x.visible)
              """)

          async def submit(frame, page):
              buttons = await get_buttons(frame)

              print(
                  "VISIBLE BUTTONS:",
                  json.dumps(
                      buttons,
                      ensure_ascii=False
                  )
              )

              # First: native submit.
              for b in buttons:
                  text = (
                      b["text"] + " " + b["aria"]
                  ).lower()

                  if (
                      b["type"].lower() == "submit"
                      or any(x in text for x in [
                          "search",
                          "continue",
                          "find",
                          "check availability",
                          "show sailings",
                      ])
                  ):
                      try:
                          await frame.locator(
                              "button"
                          ).nth(
                              b["i"]
                          ).click()

                          await page.wait_for_timeout(
                              6000
                          )

                          return True
                      except:
                          pass

              # The real page has these two cabin choices.
              for cabin in [
                  "I do not want to book a cabin",
                  "I want to book a cabin",
              ]:
                  loc = frame.get_by_text(
                      cabin,
                      exact=True
                  )

                  for i in range(await loc.count()):
                      try:
                          item = loc.nth(i)

                          if await item.is_visible():
                              print(
                                  "CLICK:",
                                  cabin
                              )

                              await item.click()

                              await page.wait_for_timeout(
                                  7000
                              )

                              return True
                      except Exception as e:
                          print(
                              "CABIN CLICK ERROR:",
                              repr(e)
                          )

              # Form submit fallback.
              try:
                  forms = frame.locator("form")

                  for i in range(await forms.count()):
                      form = forms.nth(i)

                      if await form.is_visible():
                          await form.evaluate(
                              "(f) => f.requestSubmit()"
                          )

                          await page.wait_for_timeout(
                              7000
                          )

                          return True
              except Exception as e:
                  print(
                      "FORM SUBMIT ERROR:",
                      repr(e)
                  )

              return False

          async def page_text(page, frame):
              texts = []

              try:
                  texts.append(
                      await page.locator(
                          "body"
                      ).inner_text()
                  )
              except:
                  pass

              try:
                  texts.append(
                      await frame.locator(
                          "body"
                      ).inner_text()
                  )
              except:
                  pass

              return "\n".join(texts)[:60000]

          def determine_availability(url, text):
              combined = (
                  url + "\n" + text
              ).lower()

              # Explicit negative.
              negatives = [
                  "no departures",
                  "no availability",
                  "no sailings",
                  "no results",
                  "not available",
                  "sold out",
              ]

              for word in negatives:
                  if word in combined:
                      return False, (
                          "Explicit no-availability text"
                      )

              # Strong positive result indicators.
              positives = [
                  "select departure",
                  "select sailing",
                  "select voyage",
                  "departure time",
                  "book now",
                  "continue",
                  "price",
                  "nok",
                  "eur",
                  "available",
              ]

              score = sum(
                  word in combined
                  for word in positives
              )

              # Leaving the initial booking page is strong
              # evidence that the search was actually executed.
              result_url = (
                  "/port-to-port/booking" not in url
              )

              if result_url and score >= 1:
                  return True, (
                      "Booking result page detected"
                  )

              if score >= 3:
                  return True, (
                      "Multiple availability indicators"
                  )

              return False, (
                  "No confirmed availability"
              )

          async def check_route(page, origin, destination):
              label = (
                  f"{origin} -> {destination}"
              )

              print("")
              print(
                  "==========",
                  label,
                  "=========="
              )

              await page.goto(
                  BOOKING_URL,
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              await page.wait_for_timeout(4000)

              await remove_cookie(page)

              frame = await get_booking_frame(page)

              print(
                  "BOOKING FRAME:",
                  frame.url
              )

              await set_ports(
                  frame,
                  origin,
                  destination
              )

              await page.wait_for_timeout(1000)

              await set_date(frame)

              await page.wait_for_timeout(1500)

              before = page.url

              triggered = await submit(
                  frame,
                  page
              )

              await page.wait_for_timeout(5000)

              text = await page_text(
                  page,
                  frame
              )

              available, reason = (
                  determine_availability(
                      page.url,
                      text
                  )
              )

              result = {
                  "route": label,
                  "available": available,
                  "reason": reason,
                  "triggered": triggered,
                  "before_url": before,
                  "after_url": page.url,
              }

              print(
                  json.dumps(
                      result,
                      ensure_ascii=False,
                      indent=2
                  )
              )

              results.append(result)

              safe_name = (
                  origin.replace(" ", "_")
                  + "_"
                  + destination.replace(" ", "_")
              )

              try:
                  await page.screenshot(
                      path=f"{safe_name}.png",
                      full_page=True
                  )
              except:
                  pass

          async def send_email(subject, body):
              msg = MIMEText(
                  body,
                  "plain",
                  "utf-8"
              )

              msg["Subject"] = subject
              msg["From"] = SMTP_USER
              msg["To"] = ALERT_EMAIL

              with smtplib.SMTP_SSL(
                  "smtp.qq.com",
                  465,
                  timeout=30
              ) as smtp:
                  smtp.login(
                      SMTP_USER,
                      SMTP_PASSWORD
                  )

                  smtp.sendmail(
                      SMTP_USER,
                      [ALERT_EMAIL],
                      msg.as_string()
                  )

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      headless=True
                  )

                  context = await browser.new_context(
                      viewport={
                          "width": 1440,
                          "height": 1200
                      },
                      locale="en-GB",
                      timezone_id="Europe/Oslo"
                  )

                  page = await context.new_page()

                  async def request_handler(request):
                      url = request.url.lower()

                      if request.resource_type in (
                          "xhr",
                          "fetch"
                      ):
                          if any(x in url for x in [
                              "booking",
                              "availability",
                              "sailing",
                              "voyage",
                              "search",
                              "api",
                          ]):
                              network_hits.append(
                                  redact(
                                      request.method
                                      + " "
                                      + request.url
                                  )
                              )

                  page.on(
                      "request",
                      request_handler
                  )

                  for origin, destination in ROUTES:
                      try:
                          await check_route(
                              page,
                              origin,
                              destination
                          )
                      except Exception as e:
                          errors.append(
                              f"{origin} -> {destination}: "
                              + repr(e)
                          )

                  await browser.close()

              state = load_state()

              old_routes = state.get(
                  "routes",
                  {}
              )

              current_routes = {}

              for r in results:
                  current_routes[
                      r["route"]
                  ] = r["available"]

              newly_available = []

              for route, available in (
                  current_routes.items()
              ):
                  if (
                      available
                      and not old_routes.get(
                          route,
                          False
                      )
                  ):
                      newly_available.append(
                          route
                      )

              save_state({
                  "target_date": TARGET_DATE,
                  "routes": current_routes
              })

              # Availability notification.
              if newly_available:
                  lines = [
                      "Hurtigruten Port-to-Port",
                      "AVAILABILITY DETECTED",
                      "",
                      f"Target date: {TARGET_DATE}",
                      "",
                  ]

                  for route in newly_available:
                      lines.append(
                          "AVAILABLE: " + route
                      )

                  lines += [
                      "",
                      "Open:",
                      BOOKING_URL,
                      "",
                      "Current status:",
                  ]

                  for r in results:
                      lines.append(
                          r["route"]
                          + ": "
                          + (
                              "AVAILABLE"
                              if r["available"]
                              else "NO AVAILABILITY"
                          )
                      )

                  await send_email(
                      "Hurtigruten AVAILABLE "
                      + TARGET_DATE,
                      "\n".join(lines)
                  )

              # Technical error notification.
              if errors:
                  body = [
                      "Hurtigruten monitor ERROR",
                      "",
                      f"Target date: {TARGET_DATE}",
                      "",
                  ]

                  body.extend(errors)

                  await send_email(
                      "Hurtigruten Monitor ERROR",
                      "\n".join(body)
                  )

              print("")
              print(
                  "========== FINAL =========="
              )

              for r in results:
                  print(
                      r["route"],
                      "=>",
                      "AVAILABLE"
                      if r["available"]
                      else "NO AVAILABILITY"
                  )

              print(
                  "=========================="
              )

          asyncio.run(main())
          PY

      - name: Run monitor
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          python monitor.py

      - name: Save state
        if: always()
        run: |
          git config user.name "Hurtigruten Monitor"
          git config user.email "actions@users.noreply.github.com"

          if [ -f availability_state.json ]; then
            git add availability_state.json
            git diff --cached --quiet || git commit -m "Update monitor state"
            git push || true
          fi

      - name: Upload debug screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hurtigruten-debug
          path: "*.png"
          if-no-files-found: ignore

name: Hurtigruten Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Create monitor
        run: |
          cat > monitor.py <<'PY'
          import os
          import re
          import time
          import smtplib
          from email.mime.text import MIMEText
          from playwright.sync_api import sync_playwright

          TARGET_DATE = "2027-02-07"

          ROUTES = [
              ("Svolvær", "Skjervøy"),
              ("Svolvær", "Tromsø"),
              ("Bodø", "Tromsø"),
          ]

          URL = "https://www.hurtigruten.com/en/port-to-port"

          SMTP_USER = os.environ["SMTP_USER"]
          SMTP_PASSWORD = os.environ["SMTP_PASSWORD"]
          ALERT_EMAIL = os.environ["ALERT_EMAIL"]


          def send_email(subject, body):
              msg = MIMEText(body, "plain", "utf-8")
              msg["Subject"] = subject
              msg["From"] = SMTP_USER
              msg["To"] = ALERT_EMAIL

              with smtplib.SMTP_SSL("smtp.qq.com", 465) as server:
                  server.login(SMTP_USER, SMTP_PASSWORD)
                  server.sendmail(
                      SMTP_USER,
                      [ALERT_EMAIL],
                      msg.as_string()
                  )


          def close_cookie_popup(page):
              for selector in [
                  "#onetrust-accept-btn-handler",
                  "#onetrust-reject-all-handler",
                  "button:has-text('Accept all')",
                  "button:has-text('Reject all')",
              ]:
                  try:
                      loc = page.locator(selector)

                      for i in range(loc.count()):
                          x = loc.nth(i)

                          if x.is_visible():
                              x.click(
                                  force=True,
                                  timeout=2000
                              )
                              break
                  except:
                      pass

              try:
                  page.locator(
                      ".onetrust-pc-dark-filter"
                  ).evaluate_all(
                      "(x) => x.forEach(e => e.remove())"
                  )
              except:
                  pass


          def get_frames(page):
              return [page] + [
                  f for f in page.frames
                  if f != page
              ]


          def find_port(page, field):
              if field == "from":
                  selectors = [
                      'input[placeholder="Sail from where?"]',
                      'input[placeholder*="Sail from" i]',
                      'input[aria-label*="Sail from" i]',
                  ]
              else:
                  selectors = [
                      'input[placeholder="Sail to where?"]',
                      'input[placeholder*="Sail to" i]',
                      'input[aria-label*="Sail to" i]',
                  ]

              for frame in get_frames(page):
                  for selector in selectors:
                      try:
                          loc = frame.locator(selector)

                          for i in range(loc.count()):
                              x = loc.nth(i)

                              if x.is_visible():
                                  return frame, x
                      except:
                          pass

              return None, None


          def select_port(page, port, field):
              close_cookie_popup(page)

              frame, inp = find_port(page, field)

              if inp is None:
                  raise RuntimeError(
                      f"Cannot find {field} port input"
                  )

              inp.click(force=True)
              inp.fill("")
              inp.type(port, delay=60)

              time.sleep(1.5)

              for selector in [
                  '[role="option"]:visible',
                  'li:visible',
              ]:
                  try:
                      options = frame.locator(selector)

                      for i in range(options.count()):
                          option = options.nth(i)

                          if not option.is_visible():
                              continue

                          text = option.inner_text().strip()

                          if port.lower() in text.lower():
                              option.click(force=True)
                              time.sleep(1)
                              return
                  except:
                      pass

              inp.press("ArrowDown")
              inp.press("Enter")
              time.sleep(1)


          def find_date_input(page):
              # Do NOT use value="06/09/2026".
              #
              # The diagnostic showed that the date field is
              # the input immediately after the roundtrip/oneway
              # controls.
              #
              # We therefore inspect visible inputs and identify
              # the input whose value looks like a localized date.

              for frame in get_frames(page):
                  try:
                      inputs = frame.locator("input:visible")

                      candidates = []

                      for i in range(inputs.count()):
                          x = inputs.nth(i)

                          try:
                              value = x.input_value()
                              typ = (
                                  x.get_attribute("type")
                                  or ""
                              ).lower()

                              candidates.append(
                                  (i, x, value, typ)
                              )
                          except:
                              pass

                      # First: date-looking value.
                      for i, x, value, typ in candidates:
                          if re.match(
                              r"^\d{1,2}/\d{1,2}/\d{4}$",
                              value
                          ):
                              return frame, x

                      # Second: native date input.
                      for i, x, value, typ in candidates:
                          if typ == "date":
                              return frame, x

                  except:
                      pass

              return None, None


          def set_date(page):
              frame, date_input = find_date_input(page)

              if date_input is None:
                  raise RuntimeError(
                      "Departure date input not found"
                  )

              old_value = date_input.input_value()

              print(
                  "DATE INPUT FOUND:",
                  old_value
              )

              # The actual field is a custom date field.
              # Try keyboard editing first.
              date_input.click(force=True)

              date_input.press("Control+A")
              date_input.press("Backspace")

              # Localized format used by the page.
              date_input.type(
                  "07/02/2027",
                  delay=80
              )

              date_input.press("Tab")

              time.sleep(1)

              new_value = date_input.input_value()

              print(
                  "DATE AFTER INPUT:",
                  new_value
              )

              # If direct typing did not work, open the picker
              # and navigate through keyboard.
              if "2027" not in new_value:
                  date_input.click(force=True)

                  # Try Home/End based keyboard navigation.
                  date_input.press("Control+A")
                  date_input.type(
                      "07/02/2027",
                      delay=100
                  )
                  date_input.press("Enter")
                  date_input.press("Tab")

                  time.sleep(1)

                  new_value = date_input.input_value()

              if "2027" not in new_value:
                  raise RuntimeError(
                      "Could not set target date. "
                      f"Current value: {new_value}"
                  )


          def click_no_cabin(page):
              for frame in get_frames(page):
                  try:
                      buttons = frame.get_by_role(
                          "button",
                          name=re.compile(
                              "I do not want to book a cabin",
                              re.I
                          )
                      )

                      for i in range(buttons.count()):
                          b = buttons.nth(i)

                          if b.is_visible():
                              b.click(force=True)
                              time.sleep(1)
                              return True
                  except:
                      pass

              return False


          def submit(page):
              # Do not search for "Search".
              #
              # Submit the actual form.
              for frame in get_frames(page):
                  try:
                      forms = frame.locator("form")

                      for i in range(forms.count()):
                          form = forms.nth(i)

                          if not form.is_visible():
                              continue

                          try:
                              form.evaluate(
                                  "(f) => f.requestSubmit()"
                              )
                          except:
                              try:
                                  form.locator(
                                      "button[type=submit]"
                                  ).first.click(
                                      force=True
                                  )
                              except:
                                  pass

                          time.sleep(8)
                          return

                  except:
                      pass

              # Fallback: Enter from the date field.
              frame, date_input = find_date_input(page)

              if date_input is not None:
                  date_input.press("Enter")
                  time.sleep(8)
                  return

              raise RuntimeError(
                  "Unable to submit booking form"
              )


          def read_text(page):
              result = []

              for frame in get_frames(page):
                  try:
                      result.append(
                          frame.locator(
                              "body"
                          ).inner_text(
                              timeout=5000
                          )
                      )
                  except:
                      pass

              return "\n".join(result)


          def has_target_date(text):
              t = re.sub(
                  r"\s+",
                  " ",
                  text
              ).lower()

              patterns = [
                  "07/02/2027",
                  "7/2/2027",
                  "07-02-2027",
                  "2027-02-07",
                  "7 february 2027",
                  "07 february 2027",
                  "7 feb 2027",
                  "07 feb 2027",
                  "february 7, 2027",
                  "feb 7, 2027",
              ]

              return any(
                  x.lower() in t
                  for x in patterns
              )


          def save(page, name):
              try:
                  page.screenshot(
                      path=name + ".png",
                      full_page=True
                  )
              except:
                  pass

              try:
                  with open(
                      name + ".html",
                      "w",
                      encoding="utf-8"
                  ) as f:
                      f.write(page.content())
              except:
                  pass


          def check(page, from_port, to_port):
              page.goto(
                  URL,
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              page.wait_for_timeout(5000)

              close_cookie_popup(page)

              select_port(
                  page,
                  from_port,
                  "from"
              )

              select_port(
                  page,
                  to_port,
                  "to"
              )

              print(
                  "PORTS SELECTED:",
                  from_port,
                  to_port
              )

              set_date(page)

              print(
                  "DATE SELECTED:",
                  TARGET_DATE
              )

              click_no_cabin(page)

              submit(page)

              print(
                  "RESULT URL:",
                  page.url
              )

              time.sleep(3)

              text = read_text(page)

              name = (
                  from_port.replace(" ", "_")
                  + "_"
                  + to_port.replace(" ", "_")
              )

              save(page, name)

              if has_target_date(text):
                  return True

              if TARGET_DATE in page.url:
                  return True

              return False


          def main():
              available = []
              errors = []

              with sync_playwright() as p:

                  browser = p.chromium.launch(
                      headless=True
                  )

                  context = browser.new_context(
                      viewport={
                          "width": 1440,
                          "height": 1000
                      },
                      locale="en-GB",
                      timezone_id="Europe/Oslo",
                  )

                  page = context.new_page()

                  for from_port, to_port in ROUTES:

                      route = (
                          f"{from_port} -> {to_port}"
                      )

                      try:
                          print(
                              "\nCHECKING:",
                              route
                          )

                          if check(
                              page,
                              from_port,
                              to_port
                          ):
                              available.append(route)

                      except Exception as e:
                          errors.append(
                              route
                              + "\n"
                              + type(e).__name__
                              + ": "
                              + str(e)
                          )

                  browser.close()

              if available:
                  send_email(
                      "Hurtigruten AVAILABLE",
                      "Hurtigruten availability detected\n\n"
                      f"Target date: {TARGET_DATE}\n\n"
                      + "\n".join(
                          "AVAILABLE: " + x
                          for x in available
                      )
                  )

              if errors:
                  send_email(
                      "Hurtigruten monitor ERROR",
                      "Hurtigruten monitor ERROR\n\n"
                      f"Target date: {TARGET_DATE}\n\n"
                      + "\n\n".join(errors)
                  )

              print("MONITOR FINISHED")


          if __name__ == "__main__":
              main()
          PY

      - name: Run monitor
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          python monitor.py

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hurtigruten-monitor-diagnostics
          path: |
            *.png
            *.html
            monitor.py
          if-no-files-found: ignore

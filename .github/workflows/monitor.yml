          ]

          STATE_FILE = Path("availability_state.json")

          SMTP_USER = os.environ["SMTP_USER"]
          SMTP_PASSWORD = os.environ["SMTP_PASSWORD"]
          ALERT_EMAIL = os.environ["ALERT_EMAIL"]

          results = []

          def clean(s):
              if s is None:
                  return ""
              return re.sub(r"\s+", " ", str(s)).strip()

          def fingerprint(text):
              return hashlib.sha256(text.encode("utf-8")).hexdigest()[:16]

          def load_state():
              try:
                  return json.loads(STATE_FILE.read_text())
              except:
                  return {}

          def save_state(state):
              STATE_FILE.write_text(
                  json.dumps(state, ensure_ascii=False, indent=2)
              )

          async def remove_overlays(page):
              try:
                  await page.evaluate("""
                  () => {
                    for (const s of [
                      '#onetrust-banner-sdk',
                      '#onetrust-consent-sdk',
                      '.onetrust-pc-dark-filter',
                      '[id*="cookie" i]',
                      '[class*="cookie" i]'
                    ]) {
                      document.querySelectorAll(s).forEach(e => {
                        try { e.remove(); } catch (_) {}
                      });
                    }
                    document.body.style.overflow = 'auto';
                  }
                  """)
              except:
                  pass

          async def get_frames(page):
              frames = [page.main_frame]
              for f in page.frames:
                  if f != page.main_frame:
                      frames.append(f)
              return frames

          async def get_visible_inputs(frame):
              try:
                  return await frame.locator("input").evaluate_all("""
                  els => els.map((e,i) => {
                    const r = e.getBoundingClientRect();
                    return {
                      i,
                      type:e.type || '',
                      name:e.name || '',
                      id:e.id || '',
                      value:e.value || '',
                      placeholder:e.placeholder || '',
                      aria:e.getAttribute('aria-label') || '',
                      visible:r.width>0 && r.height>0 &&
                        getComputedStyle(e).display !== 'none' &&
                        getComputedStyle(e).visibility !== 'hidden'
                    }
                  }).filter(x => x.visible)
                  """)
              except:
                  return []

          async def find_port_inputs(page):
              candidates = []

              for frame in await get_frames(page):
                  data = await get_visible_inputs(frame)

                  for x in data:
                      typ = x["type"].lower()
                      if typ not in ("text", "search", ""):
                          continue

                      value = clean(x["value"])
                      placeholder = clean(x["placeholder"]).lower()
                      aria = clean(x["aria"]).lower()

                      # Ignore generic site search.
                      if "search for anything" in placeholder:
                          continue

                      if any(k in placeholder + " " + aria for k in [
                          "from", "to", "port", "sail"
                      ]):
                          candidates.append((frame, x["i"], x))

                  if len(candidates) >= 2:
                      return candidates[:2]

              # Fallback: visible text inputs whose values resemble ports.
              for frame in await get_frames(page):
                  data = await get_visible_inputs(frame)
                  for x in data:
                      if x["type"].lower() not in ("text", "search", ""):
                          continue
                      if "search for anything" in clean(x["placeholder"]).lower():
                          continue
                      candidates.append((frame, x["i"], x))

                  if len(candidates) >= 2:
                      return candidates[:2]

              return candidates[:2]


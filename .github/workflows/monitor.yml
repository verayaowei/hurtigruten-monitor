name: Hurtigruten Monitor
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: read
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium
      - name: Restore monitor state
        uses: actions/cache/restore@v4
        with:
          path: .monitor-state
          key: hurtigruten-monitor-state-${{ github.run_id }}
          restore-keys: |
            hurtigruten-monitor-state-
      - name: Create monitor
        run: |
          cat > monitor.py <<'PY'
          import os
          import re
          import json
          import time
          from datetime import datetime, timezone
          from playwright.sync_api import sync_playwright
          URL = "https://www.hurtigruten.com/en/port-to-port"
          ROUTES = [
              ("Svolvær", "Skjervøy"),
              ("Svolvær", "Tromsø"),
              ("Bodø", "Tromsø"),
          ]
          TARGET_DATE = "2027-02-07"
          STATE_DIR = ".monitor-state"
          STATE_FILE = os.path.join(STATE_DIR, "state.json")
          def log(message):
              now = datetime.now(timezone.utc).isoformat()
              print(f"[{now}] {message}", flush=True)
          def safe_name(text):
              return re.sub(r"[^A-Za-z0-9_-]+", "_", text)
          def screenshot(page, name):
              try:
                  page.screenshot(
                      path=f"{safe_name(name)}.png",
                      full_page=True
                  )
                  log(f"Screenshot saved: {name}.png")
              except Exception as e:
                  log(f"Screenshot failed: {e}")
          def body_text(page):
              try:
                  return page.locator("body").inner_text(timeout=30000)
              except Exception as e:
                  log(f"Body text error: {e}")
                  return ""
          def visible_inputs(page):
              result = []
              inputs = page.locator("input")
              for i in range(inputs.count()):
                  try:
                      el = inputs.nth(i)
                      if not el.is_visible():
                          continue
                      result.append(el)
                  except Exception:
                      pass
              return result
          def select_port(page, port, kind):
              log(f"Selecting {kind}: {port}")
              inputs = visible_inputs(page)
              # First try placeholders / aria labels.
              patterns = []
              if kind == "FROM":
                  patterns = [
                      "Sail from where?",
                      "From Port",
                      "From",
                      "Departure"
                  ]
              else:
                  patterns = [
                      "Sail to where?",
                      "To Port",
                      "To",
                      "Arrival"
                  ]
              for pattern in patterns:
                  try:
                      locator = page.get_by_placeholder(
                          pattern,
                          exact=True
                      )
                      if locator.count() > 0:
                          field = locator.first
                          if field.is_visible():
                              field.click()
                              field.fill(port)
                              page.wait_for_timeout(2500)
                              if click_port_option(page, port):
                                  return
                  except Exception:
                      pass
                  try:
                      locator = page.get_by_label(
                          pattern,
                          exact=False
                      )
                      if locator.count() > 0:
                          field = locator.first
                          if field.is_visible():
                              field.click()
                              field.fill(port)
                              page.wait_for_timeout(2500)
                              if click_port_option(page, port):
                                  return
                  except Exception:
                      pass
              # Fallback: first two visible text inputs.
              text_inputs = []
              for el in inputs:
                  try:
                      typ = (el.get_attribute("type") or "text").lower()
                      if typ in ("text", "search", ""):
                          text_inputs.append(el)
                  except Exception:
                      pass
              index = 0 if kind == "FROM" else 1
              if len(text_inputs) > index:
                  field = text_inputs[index]
                  field.click()
                  field.fill(port)
                  page.wait_for_timeout(2500)
                  if click_port_option(page, port):
                      return
              raise RuntimeError(
                  f"Could not select {kind} port: {port}"
              )
          def click_port_option(page, port):
              # Exact visible text.
              try:
                  matches = page.get_by_text(
                      port,
                      exact=True
                  )
                  for i in range(matches.count() - 1, -1, -1):
                      try:
                          item = matches.nth(i)
                          if item.is_visible():
                              item.click()
                              page.wait_for_timeout(1200)
                              log(f"Selected exact port: {port}")
                              return True
                      except Exception:
                          pass
              except Exception:
                  pass
              # Autocomplete / option fallback.
              selectors = [
                  '[role="option"]',
                  'li',
                  '[class*="option"]',
                  '[class*="autocomplete"]',
                  '[class*="suggestion"]'
              ]
              for selector in selectors:
                  try:
                      items = page.locator(selector)
                      for i in range(items.count()):
                          try:
                              item = items.nth(i)
                              if not item.is_visible():
                                  continue
                              text = item.inner_text().strip()
                              if (
                                  text
                                  and port.lower() in text.lower()
                              ):
                                  item.click()
                                  page.wait_for_timeout(1200)
                                  log(
                                      f"Selected fallback port: {text}"
                                  )
                                  return True
                          except Exception:
                              pass
                  except Exception:
                      pass
              return False
          def set_target_date(page):
              log(f"Trying to set target date: {TARGET_DATE}")
              # Native date inputs.
              inputs = page.locator(
                  'input[type="date"]'
              )
              for i in range(inputs.count()):
                  try:
                      field = inputs.nth(i)
                      if not field.is_visible():
                          continue
                      field.fill(TARGET_DATE)
                      log("Target date entered into date input.")
                      return True
                  except Exception as e:
                      log(f"Date input attempt failed: {e}")
              # Inputs with date-related attributes.
              all_inputs = page.locator("input")
              for i in range(all_inputs.count()):
                  try:
                      field = all_inputs.nth(i)
                      if not field.is_visible():
                          continue
                      attrs = " ".join([
                          field.get_attribute("placeholder") or "",
                          field.get_attribute("aria-label") or "",
                          field.get_attribute("name") or "",
                          field.get_attribute("id") or ""
                      ]).lower()
                      if any(
                          word in attrs
                          for word in [
                              "date",
                              "departure",
                              "travel"
                          ]
                      ):
                          field.click()
                          try:
                              field.fill(TARGET_DATE)
                          except Exception:
                              field.press("Control+A")
                              field.type(TARGET_DATE)
                          log(
                              "Target date entered into "
                              "date-related field."
                          )
                          return True
                  except Exception:
                      pass
              log(
                  "No editable date field found. "
                  "Continuing with page search."
              )
              return False
          def click_search(page):
              log("Looking for search button...")
              patterns = [
                  "Search",
                  "Show availability",
                  "Find availability",
                  "Check availability",
                  "Continue",
                  "See availability",
                  "View availability"
              ]
              for pattern in patterns:
                  try:
                      buttons = page.get_by_role(
                          "button",
                          name=re.compile(pattern, re.I)
                      )
                      for i in range(buttons.count()):
                          try:
                              button = buttons.nth(i)
                              if (
                                  button.is_visible()
                                  and button.is_enabled()
                              ):
                                  log(
                                      "Clicking button: "
                                      + button.inner_text().strip()
                                  )
                                  button.click()
                                  return True
                          except Exception:
                              pass
                  except Exception:
                      pass
              # Generic button fallback.
              try:
                  buttons = page.locator("button")
                  for i in range(buttons.count()):
                      try:
                          button = buttons.nth(i)
                          if not button.is_visible():
                              continue
                          if not button.is_enabled():
                              continue
                          text = button.inner_text().strip()
                          if re.search(
                              r"search|availability|continue|"
                              r"find|show|view",
                              text,
                              re.I
                          ):
                              log(
                                  "Clicking fallback button: "
                                  + text
                              )
                              button.click()
                              return True
                      except Exception:
                          pass
              except Exception:
                  pass
              # Submit buttons.
              try:
                  submits = page.locator(
                      'button[type="submit"], input[type="submit"]'
                  )
                  for i in range(submits.count()):
                      try:
                          button = submits.nth(i)
                          if (
                              button.is_visible()
                              and button.is_enabled()
                          ):
                              log("Clicking submit button.")
                              button.click()
                              return True
                      except Exception:
                          pass
              except Exception:
                  pass
              # Last fallback: press Enter on the last visible input.
              inputs = visible_inputs(page)
              if inputs:
                  try:
                      inputs[-1].press("Enter")
                      log("Pressed Enter as final search fallback.")
                      return True
                  except Exception:
                      pass
              return False
          def exact_target_date_present(text):
              normalized = re.sub(
                  r"\s+",
                  " ",
                  text.lower()
              )
              patterns = [
                  r"\b2027[-/.]02[-/.]07\b",
                  r"\b07[-/.]02[-/.]2027\b",
                  r"\b7[-/.]2[-/.]2027\b",
                  r"\b07\s+feb(?:ruary)?\s+2027\b",
                  r"\b7\s+feb(?:ruary)?\s+2027\b",
                  r"\bfeb(?:ruary)?\s+7,?\s+2027\b"
              ]
              return any(
                  re.search(pattern, normalized)
                  for pattern in patterns
              )
          def negative_result(text):
              lower = text.lower()
              negatives = [
                  "no availability",
                  "no voyages",
                  "no sailings",
                  "not available",
                  "sold out",
                  "no results",
                  "nothing found",
                  "unavailable"
              ]
              return [
                  item
                  for item in negatives
                  if item in lower
              ]
          def booking_signals(text):
              lower = text.lower()
              signals = [
                  "book now",
                  "book",
                  "price",
                  "nok",
                  "eur",
                  "available",
                  "departure",
                  "sailing",
                  "voyage",
                  "select"
              ]
              return [
                  item
                  for item in signals
                  if item in lower
              ]
          def inspect_result(page, route):
              text = body_text(page)
              screenshot(
                  page,
                  f"result_{route[0]}_{route[1]}"
              )
              log("----- RESULT PAGE -----")
              log(f"URL: {page.url}")
              log(f"TITLE: {page.title()}")
              print(text[:50000])
              date_ok = exact_target_date_present(text)
              negatives = negative_result(text)
              signals = booking_signals(text)
              price_found = bool(
                  re.search(
                      r"(€|EUR|NOK|£|GBP|\$|USD)\s?\d",
                      text,
                      re.I
                  )
                  or re.search(
                      r"\d[\d,.]*\s?(EUR|NOK|GBP|USD)",
                      text,
                      re.I
                  )
              )
              log(f"Exact target date visible: {date_ok}")
              log(f"Booking signals: {signals}")
              log(f"Negative signals: {negatives}")
              log(f"Price found: {price_found}")
              # Strict rule:
              # The exact target date must be visible.
              # A negative result blocks notification.
              potential = (
                  date_ok
                  and not negatives
                  and (
                      price_found
                      or "book now" in text.lower()
                      or "available" in text.lower()
                  )
              )
              return {
                  "potential": potential,
                  "date_visible": date_ok,
                  "price_found": price_found,
                  "negative_signals": negatives,
                  "positive_signals": signals,
                  "url": page.url,
                  "text": text[:12000]
              }
          def check_route(browser, route):
              context = browser.new_context(
                  viewport={
                      "width": 1440,
                      "height": 1100
                  },
                  locale="en-GB",
                  timezone_id="Europe/Oslo"
              )
              page = context.new_page()
              try:
                  log("")
                  log("=" * 80)
                  log(
                      f"CHECKING: "
                      f"{route[0]} -> {route[1]}"
                  )
                  log("=" * 80)
                  page.goto(
                      URL,
                      wait_until="domcontentloaded",
                      timeout=120000
                  )
                  page.wait_for_timeout(10000)
                  screenshot(
                      page,
                      f"before_{route[0]}_{route[1]}"
                  )
                  select_port(
                      page,
                      route[0],
                      "FROM"
                  )
                  select_port(
                      page,
                      route[1],
                      "TO"
                  )
                  page.wait_for_timeout(2000)
                  set_target_date(page)
                  page.wait_for_timeout(1500)
                  if not click_search(page):
                      raise RuntimeError(
                          "Search/availability button "
                          "could not be found."
                      )
                  page.wait_for_timeout(8000)
                  try:
                      page.wait_for_load_state(
                          "domcontentloaded",
                          timeout=30000
                      )
                  except Exception:
                      pass
                  page.wait_for_timeout(8000)
                  result = inspect_result(
                      page,
                      route
                  )
                  result["route"] = route
                  return result
              except Exception as e:
                  log(
                      f"ERROR on route "
                      f"{route[0]} -> {route[1]}: "
                      f"{type(e).__name__}: {e}"
                  )
                  screenshot(
                      page,
                      f"ERROR_{route[0]}_{route[1]}"
                  )
                  return {
                      "route": route,
                      "error": (
                          f"{type(e).__name__}: {e}"
                      ),
                      "potential": False,
                      "failed": True,
                      "url": page.url
                  }
              finally:
                  context.close()
          def load_state():
              os.makedirs(
                  STATE_DIR,
                  exist_ok=True
              )
              if not os.path.exists(STATE_FILE):
                  return {}
              try:
                  with open(
                      STATE_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:
                      return json.load(f)
              except Exception:
                  return {}
          def save_state(state):
              os.makedirs(
                  STATE_DIR,
                  exist_ok=True
              )
              with open(
                  STATE_FILE,
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      state,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )
          def main():
              log("========================================")
              log("Hurtigruten Monitor START")
              log(f"Target date: {TARGET_DATE}")
              log(f"Routes: {len(ROUTES)}")
              log("========================================")
              previous_state = load_state()
              results = []
              with sync_playwright() as p:
                  browser = p.chromium.launch(
                      headless=True,
                      args=[
                          "--disable-blink-features=AutomationControlled"
                      ]
                  )
                  try:
                      for route in ROUTES:
                          result = check_route(
                              browser,
                              route
                          )
                          results.append(result)
                  finally:
                      browser.close()
              found = [
                  result
                  for result in results
                  if result.get("potential")
              ]
              failures = [
                  result
                  for result in results
                  if result.get("failed")
              ]
              new_found = []
              for result in found:
                  route = result["route"]
                  key = (
                      f"{route[0]}->{route[1]}"
                      f"@{TARGET_DATE}"
                  )
                  if not previous_state.get(
                      key,
                      False
                  ):
                      new_found.append(result)
                  previous_state[key] = True
              # Reset notification state once availability disappears.
              for result in results:
                  if result.get("failed"):
                      continue
                  route = result["route"]
                  key = (
                      f"{route[0]}->{route[1]}"
                      f"@{TARGET_DATE}"
                  )
                  if not result.get("potential"):
                      previous_state[key] = False
              save_state(previous_state)
              # Failure report.
              if failures:
                  lines = [
                      "Hurtigruten monitor failure",
                      "",
                      f"Target date: {TARGET_DATE}",
                      ""
                  ]
                  for result in failures:
                      route = result["route"]
                      lines.append(
                          f"Route: "
                          f"{route[0]} -> {route[1]}"
                      )
                      lines.append(
                          f"Error: "
                          f"{result.get('error', 'unknown')}"
                      )
                      lines.append(
                          f"URL: "
                          f"{result.get('url', '')}"
                      )
                      lines.append("")
                  with open(
                      "monitor_failed.txt",
                      "w",
                      encoding="utf-8"
                  ) as f:
                      f.write(
                          "\n".join(lines)
                      )
                  log(
                      f"Monitor encountered "
                      f"{len(failures)} route failure(s)."
                  )
                  # Keep going so diagnostic files are saved.
                  # Exit code 1 is intentionally avoided here;
                  # the failure email step handles the alert.
                  return
              # Availability notification.
              if new_found:
                  lines = [
                      "Hurtigruten 航次提醒",
                      "",
                      f"目标日期：{TARGET_DATE}",
                      ""
                  ]
                  for result in new_found:
                      route = result["route"]
                      lines.append(
                          f"路线："
                          f"{route[0]} → {route[1]}"
                      )
                      lines.append(
                          f"页面："
                          f"{result.get('url', '')}"
                      )
                      lines.append(
                          "检测到目标日期，并发现"
                          "可预订/价格等航次信号。"
                      )
                      lines.append("")
                  with open(
                      "availability_found.txt",
                      "w",
                      encoding="utf-8"
                  ) as f:
                      f.write(
                          "\n".join(lines)
                      )
                  log(
                      f"NEW availability found: "
                      f"{len(new_found)} route(s)"
                  )
              elif found:
                  log(
                      "Availability still present; "
                      "notification already sent."
                  )
              else:
                  log(
                      "No target-date availability."
                  )
              log("Hurtigruten Monitor FINISHED")
          if __name__ == "__main__":
              main()
          PY
      - name: Run Monitor
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          python monitor.py
      - name: Send availability alert
        if: hashFiles('availability_found.txt') != ''
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          from email.mime.text import MIMEText
          from email.header import Header
          user = os.environ["SMTP_USER"]
          password = os.environ["SMTP_PASSWORD"]
          recipient = os.environ["ALERT_EMAIL"]
          with open(
              "availability_found.txt",
              "r",
              encoding="utf-8"
          ) as f:
              body = f.read()
          message = MIMEText(
              body,
              "plain",
              "utf-8"
          )
          message["Subject"] = Header(
              "Hurtigruten 航次提醒",
              "utf-8"
          )
          message["From"] = user
          message["To"] = recipient
          with smtplib.SMTP_SSL(
              "smtp.qq.com",
              465,
              timeout=30
          ) as smtp:
              smtp.login(
                  user,
                  password
              )
              smtp.sendmail(
                  user,
                  [recipient],
                  message.as_string()
              )
          print("Availability email sent.")
          PY
      - name: Send monitor failure alert
        if: hashFiles('monitor_failed.txt') != ''
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          from email.mime.text import MIMEText
          from email.header import Header
          user = os.environ["SMTP_USER"]
          password = os.environ["SMTP_PASSWORD"]
          recipient = os.environ["ALERT_EMAIL"]
          with open(
              "monitor_failed.txt",
              "r",
              encoding="utf-8"
          ) as f:
              body = f.read()
          message = MIMEText(
              body,
              "plain",
              "utf-8"
          )
          message["Subject"] = Header(
              "⚠️ Hurtigruten 监控异常",
              "utf-8"
          )
          message["From"] = user
          message["To"] = recipient
          with smtplib.SMTP_SSL(
              "smtp.qq.com",
              465,
              timeout=30
          ) as smtp:
              smtp.login(
                  user,
                  password
              )
              smtp.sendmail(
                  user,
                  [recipient],
                  message.as_string()
              )
          print("Failure email sent.")
          PY
      - name: Save monitor state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .monitor-state
          key: hurtigruten-monitor-state-${{ github.run_id }}
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hurtigruten-diagnostics
          path: |
            *.png
            availability_found.txt
            monitor_failed.txt
            .monitor-state/state.json
          if-no-files-found: ignore

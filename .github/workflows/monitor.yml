name: Hurtigruten Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Create monitor
        run: |
          cat > monitor.py <<'PY'
          from playwright.sync_api import sync_playwright
          from datetime import datetime
          import os
          import re

          URL = "https://www.hurtigruten.com/en/port-to-port"

          ROUTES = [
              ("Svolvær", "Skjervøy"),
              ("Svolvær", "Tromsø"),
              ("Bodø", "Tromsø"),
          ]

          TARGET_DATE = "2027-02-07"


          def log(message):
              print(
                  f"[{datetime.utcnow().isoformat()}] {message}",
                  flush=True
              )


          def safe_name(text):
              return re.sub(r"[^A-Za-z0-9_-]+", "_", text)


          def save_screenshot(page, name):
              try:
                  page.screenshot(
                      path=f"{safe_name(name)}.png",
                      full_page=True
                  )
              except Exception as e:
                  log(f"Screenshot failed: {e}")


          def page_text(page):
              try:
                  return page.locator("body").inner_text(
                      timeout=30000
                  )
              except Exception as e:
                  log(f"Could not read page text: {e}")
                  return ""


          def select_port(page, input_index, port):
              inputs = page.locator("input")

              if inputs.count() <= input_index:
                  raise RuntimeError(
                      f"Input {input_index} not found"
                  )

              box = inputs.nth(input_index)

              log(
                  f"Selecting "
                  f"{'FROM' if input_index == 0 else 'TO'}: "
                  f"{port}"
              )

              box.click()
              box.fill(port)

              page.wait_for_timeout(2000)

              # Exact visible autocomplete result.
              exact = page.get_by_text(
                  port,
                  exact=True
              )

              for i in range(exact.count() - 1, -1, -1):
                  try:
                      item = exact.nth(i)

                      if item.is_visible():
                          item.click()
                          page.wait_for_timeout(1000)
                          log(f"Selected {port}")
                          return
                  except Exception:
                      pass

              # Fallback for autocomplete options.
              candidates = page.locator(
                  '[role="option"], '
                  'li, '
                  '[class*="option"], '
                  '[class*="autocomplete"]'
              )

              for i in range(candidates.count()):
                  try:
                      item = candidates.nth(i)

                      if not item.is_visible():
                          continue

                      text = item.inner_text().strip()

                      if port.lower() in text.lower():
                          item.click()
                          page.wait_for_timeout(1000)
                          log(f"Selected fallback: {text}")
                          return
                  except Exception:
                      pass

              raise RuntimeError(
                  f"Could not select port: {port}"
              )


          def select_date_if_available(page):
              log(f"Trying to set date: {TARGET_DATE}")

              # First try native date inputs.
              date_inputs = page.locator(
                  'input[type="date"]'
              )

              for i in range(date_inputs.count()):
                  try:
                      field = date_inputs.nth(i)

                      if field.is_visible() and field.is_enabled():
                          field.fill(TARGET_DATE)
                          log("Date filled using input[type=date]")
                          page.wait_for_timeout(1000)
                          return True
                  except Exception:
                      pass

              # Then try accessible labels.
              labels = [
                  "Departure date",
                  "Date",
                  "Travel date",
                  "Departure"
              ]

              for label in labels:
                  try:
                      field = page.get_by_label(
                          re.compile(label, re.I)
                      ).first

                      if field.is_visible() and field.is_enabled():
                          try:
                              field.fill(TARGET_DATE)
                              log(
                                  f"Date filled using label: {label}"
                              )
                              page.wait_for_timeout(1000)
                              return True
                          except Exception:
                              pass
                  except Exception:
                      pass

              log(
                  "No directly editable date field found. "
                  "Continuing with route search."
              )

              return False


          def find_search_button(page):
              patterns = [
                  r"^Search$",
                  r"Search",
                  r"Show availability",
                  r"Find availability",
                  r"Check availability",
                  r"Continue"
              ]

              for pattern in patterns:
                  buttons = page.get_by_role(
                      "button",
                      name=re.compile(pattern, re.I)
                  )

                  for i in range(buttons.count()):
                      try:
                          button = buttons.nth(i)

                          if (
                              button.is_visible()
                              and button.is_enabled()
                          ):
                              return button
                      except Exception:
                          pass

              # Generic button fallback.
              buttons = page.locator("button")

              for i in range(buttons.count()):
                  try:
                      button = buttons.nth(i)

                      if not button.is_visible():
                          continue

                      text = button.inner_text().strip()

                      if re.search(
                          r"search|availability|continue",
                          text,
                          re.I
                      ):
                          return button
                  except Exception:
                      pass

              return None


          def inspect_result(page, route):
              text = page_text(page)
              lower = text.lower()

              log("----- RESULT PAGE -----")
              log(f"URL: {page.url}")
              log(f"TITLE: {page.title()}")
              print(text[:40000])

              save_screenshot(
                  page,
                  "result_"
                  + route[0]
                  + "_"
                  + route[1]
              )

              negative_patterns = [
                  "no availability",
                  "no voyages",
                  "no sailings",
                  "not available",
                  "sold out",
                  "no results",
                  "nothing found"
              ]

              positive_patterns = [
                  "available",
                  "availability",
                  "departure",
                  "sailing",
                  "voyage",
                  "price"
              ]

              negative_hits = [
                  x for x in negative_patterns
                  if x in lower
              ]

              positive_hits = [
                  x for x in positive_patterns
                  if x in lower
              ]

              # Detect common currency / price formats.
              has_price = bool(
                  re.search(
                      r"(€|EUR|NOK|£|GBP|\$|USD)\s?\d",
                      text,
                      re.I
                  )
                  or
                  re.search(
                      r"\d[\d,.]*\s?(EUR|NOK|GBP|USD)",
                      text,
                      re.I
                  )
              )

              log(f"Positive terms: {positive_hits}")
              log(f"Negative terms: {negative_hits}")
              log(f"Price detected: {has_price}")

              # Conservative rule:
              # email only when there is meaningful result information
              # and no explicit "no availability" message.
              potential = (
                  len(positive_hits) >= 2
                  and not negative_hits
                  and (
                      has_price
                      or "departure" in lower
                      or "sailing" in lower
                      or "voyage" in lower
                  )
              )

              return potential


          def check_route(browser, route):
              context = browser.new_context(
                  viewport={
                      "width": 1440,
                      "height": 1000
                  },
                  locale="en-GB",
                  timezone_id="Europe/Oslo"
              )

              page = context.new_page()

              try:
                  log("")
                  log("=" * 80)
                  log(
                      f"CHECKING: "
                      f"{route[0]} -> {route[1]}"
                  )
                  log("=" * 80)

                  page.goto(
                      URL,
                      wait_until="domcontentloaded",
                      timeout=120000
                  )

                  page.wait_for_timeout(10000)

                  save_screenshot(
                      page,
                      "before_"
                      + route[0]
                      + "_"
                      + route[1]
                  )

                  log(
                      f"Initial URL: {page.url}"
                  )

                  # The verified page exposes these as the first
                  # two relevant inputs.
                  select_port(page, 0, route[0])
                  select_port(page, 1, route[1])

                  page.wait_for_timeout(1500)

                  # Try date if the page exposes an editable date field.
                  select_date_if_available(page)

                  page.wait_for_timeout(1500)

                  button = find_search_button(page)

                  if button is None:
                      raise RuntimeError(
                          "Could not find Search/Availability button"
                      )

                  log(
                      f"Clicking search button: "
                      f"{button.inner_text().strip()}"
                  )

                  button.click()

                  page.wait_for_timeout(5000)

                  try:
                      page.wait_for_load_state(
                          "domcontentloaded",
                          timeout=30000
                      )
                  except Exception:
                      pass

                  page.wait_for_timeout(5000)

                  potential = inspect_result(
                      page,
                      route
                  )

                  if potential:
                      log(
                          "POTENTIAL AVAILABILITY FOUND: "
                          f"{route[0]} -> {route[1]}"
                      )

                  else:
                      log(
                          "No confirmed/potential availability "
                          "detected."
                      )

                  return {
                      "route": route,
                      "potential": potential,
                      "url": page.url
                  }

              except Exception as e:
                  log(
                      f"ERROR checking "
                      f"{route[0]} -> {route[1]}: "
                      f"{type(e).__name__}: {e}"
                  )

                  save_screenshot(
                      page,
                      "ERROR_"
                      + route[0]
                      + "_"
                      + route[1]
                  )

                  return {
                      "route": route,
                      "potential": False,
                      "error": str(e),
                      "url": page.url
                  }

              finally:
                  context.close()


          def main():
              log("Starting Hurtigruten monitor")
              log(f"Target date: {TARGET_DATE}")

              found = []

              with sync_playwright() as p:
                  browser = p.chromium.launch(
                      headless=True
                  )

                  for route in ROUTES:
                      result = check_route(
                          browser,
                          route
                      )

                      if result.get("potential"):
                          found.append(result)

                  browser.close()

              # Only create this file when the monitor has found
              # something worth notifying about.
              if found:
                  with open(
                      "availability_found.txt",
                      "w",
                      encoding="utf-8"
                  ) as f:

                      f.write(
                          "Hurtigruten availability alert\n\n"
                      )

                      f.write(
                          f"Target date: {TARGET_DATE}\n\n"
                      )

                      for result in found:
                          route = result["route"]

                          f.write(
                              f"Route: "
                              f"{route[0]} -> {route[1]}\n"
                          )

                          f.write(
                              f"URL: "
                              f"{result.get('url', '')}\n\n"
                          )

                  log(
                      f"Created availability_found.txt "
                      f"for {len(found)} route(s)."
                  )

              else:
                  log(
                      "No potential availability. "
                      "No email will be sent."
                  )


          if __name__ == "__main__":
              main()
          PY

      - name: Run monitor
        run: python monitor.py

      - name: Send QQ email alert
        if: success() && hashFiles('availability_found.txt') != ''
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          from email.mime.text import MIMEText
          from email.header import Header

          user = os.environ["SMTP_USER"]
          password = os.environ["SMTP_PASSWORD"]
          recipient = os.environ["ALERT_EMAIL"]

          with open(
              "availability_found.txt",
              "r",
              encoding="utf-8"
          ) as f:
              body = f.read()

          message = MIMEText(
              body,
              "plain",
              "utf-8"
          )

          message["Subject"] = Header(
              "Hurtigruten 航次提醒",
              "utf-8"
          )

          message["From"] = user
          message["To"] = recipient

          print(
              f"Sending alert to {recipient}"
          )

          with smtplib.SMTP_SSL(
              "smtp.qq.com",
              465,
              timeout=30
          ) as smtp:

              smtp.login(
                  user,
                  password
              )

              smtp.sendmail(
                  user,
                  [recipient],
                  message.as_string()
              )

          print("QQ email sent successfully.")

          PY

      - name: Save diagnostic screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hurtigruten-diagnostics
          path: |
            *.png
            availability_found.txt
          if-no-files-found: ignore

name: Hurtigruten Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Create monitor
        run: |
          cat > monitor.py <<'PY'
          from playwright.sync_api import sync_playwright
          from datetime import datetime
          import os
          import re
          import json
          import time

          URL = "https://www.hurtigruten.com/en/port-to-port"

          ROUTES = [
              ("Svolvær", "Skjervøy"),
              ("Svolvær", "Tromsø"),
              ("Bodø", "Tromsø"),
          ]

          TARGET_DATE = "2027-02-07"

          # Possible date representations used by websites.
          DATE_VARIANTS = [
              "2027-02-07",
              "07/02/2027",
              "7/2/2027",
              "07.02.2027",
              "7.2.2027",
              "07 Feb 2027",
              "7 Feb 2027",
              "07 February 2027",
              "7 February 2027",
              "February 7, 2027",
          ]


          def log(message):
              print(
                  f"[{datetime.utcnow().isoformat()}] {message}",
                  flush=True
              )


          def safe_name(text):
              return re.sub(
                  r"[^A-Za-z0-9_-]+",
                  "_",
                  text
              )


          def screenshot(page, name):
              try:
                  page.screenshot(
                      path=f"{safe_name(name)}.png",
                      full_page=True
                  )
              except Exception as e:
                  log(f"Screenshot failed: {e}")


          def visible_inputs(page):
              result = []

              for i in range(page.locator("input").count()):
                  try:
                      el = page.locator("input").nth(i)

                      if el.is_visible():
                          result.append(el)
                  except Exception:
                      pass

              return result


          def port_inputs(page):
              result = []

              for el in visible_inputs(page):
                  try:
                      typ = (
                          el.get_attribute("type")
                          or ""
                      ).lower()

                      if typ in (
                          "hidden",
                          "radio",
                          "checkbox",
                          "date"
                      ):
                          continue

                      placeholder = (
                          el.get_attribute("placeholder")
                          or ""
                      ).lower()

                      aria = (
                          el.get_attribute("aria-label")
                          or ""
                      ).lower()

                      value = el.input_value().strip()

                      # Ignore global site search.
                      if (
                          "search for anything"
                          in placeholder
                          or value.lower()
                          == "search for anything"
                      ):
                          continue

                      if (
                          typ in ("text", "search", "")
                          or "port" in placeholder
                          or "port" in aria
                      ):
                          result.append(el)

                  except Exception:
                      pass

              return result


          def select_port(page, port, index):
              fields = port_inputs(page)

              log(
                  f"Port fields detected: {len(fields)}"
              )

              if len(fields) < 2:
                  raise RuntimeError(
                      "Could not locate the two Port fields."
                  )

              field = fields[index]

              log(
                  f"Setting "
                  f"{'FROM' if index == 0 else 'TO'} "
                  f"= {port}"
              )

              field.click()
              field.fill("")

              field.fill(port)

              page.wait_for_timeout(1200)

              # Exact text result.
              exact = page.get_by_text(
                  port,
                  exact=True
              )

              for i in range(
                  exact.count() - 1,
                  -1,
                  -1
              ):
                  try:
                      item = exact.nth(i)

                      if item.is_visible():
                          item.click()
                          page.wait_for_timeout(700)

                          log(
                              f"Selected {port}"
                          )

                          return
                  except Exception:
                      pass

              # role=option fallback.
              options = page.locator(
                  '[role="option"]'
              )

              for i in range(options.count()):
                  try:
                      item = options.nth(i)

                      if not item.is_visible():
                          continue

                      text = item.inner_text().strip()

                      if port.lower() in text.lower():
                          item.click()
                          page.wait_for_timeout(700)

                          log(
                              f"Selected option {text}"
                          )

                          return
                  except Exception:
                      pass

              # li fallback.
              options = page.locator("li")

              for i in range(options.count()):
                  try:
                      item = options.nth(i)

                      if not item.is_visible():
                          continue

                      text = item.inner_text().strip()

                      if text.lower() == port.lower():
                          item.click()
                          page.wait_for_timeout(700)

                          log(
                              f"Selected list item {text}"
                          )

                          return
                  except Exception:
                      pass

              raise RuntimeError(
                  f"Could not select port: {port}"
              )


          def set_target_date(page):
              log(
                  f"Setting target date {TARGET_DATE}"
              )

              fields = visible_inputs()

              # First choice: native date input.
              for el in fields:
                  try:
                      typ = (
                          el.get_attribute("type")
                          or ""
                      ).lower()

                      if typ != "date":
                          continue

                      if not el.is_enabled():
                          continue

                      try:
                          el.fill(TARGET_DATE)
                      except Exception:
                          page.evaluate(
                              """([el, value]) => {
                                  const setter =
                                    Object.getOwnPropertyDescriptor(
                                      HTMLInputElement.prototype,
                                      "value"
                                    ).set;
                                  setter.call(el, value);
                                  el.dispatchEvent(
                                    new Event(
                                      "input",
                                      {bubbles:true}
                                    )
                                  );
                                  el.dispatchEvent(
                                    new Event(
                                      "change",
                                      {bubbles:true}
                                    )
                                  );
                              }""",
                              [el, TARGET_DATE]
                          )

                      log(
                          "Native date input updated."
                      )

                      return True

                  except Exception:
                      pass

              # Second choice: date-looking value.
              for el in fields:
                  try:
                      typ = (
                          el.get_attribute("type")
                          or ""
                      ).lower()

                      if typ in (
                          "hidden",
                          "radio",
                          "checkbox"
                      ):
                          continue

                      value = el.input_value().strip()

                      if re.fullmatch(
                          r"\d{1,2}/\d{1,2}/\d{4}",
                          value
                      ):
                          log(
                              f"Found date field: {value}"
                          )

                          try:
                              el.fill(TARGET_DATE)
                          except Exception:
                              page.evaluate(
                                  """([el, value]) => {
                                      const setter =
                                        Object.getOwnPropertyDescriptor(
                                          HTMLInputElement.prototype,
                                          "value"
                                        ).set;
                                      setter.call(el, value);
                                      el.dispatchEvent(
                                        new Event(
                                          "input",
                                          {bubbles:true}
                                        )
                                      );
                                      el.dispatchEvent(
                                        new Event(
                                          "change",
                                          {bubbles:true}
                                        )
                                      );
                                  }""",
                                  [el, TARGET_DATE]
                              )

                          return True

                  except Exception:
                      pass

              log(
                  "Date field could not be identified."
              )

              return False


          def click_no_cabin(page):
              pattern = re.compile(
                  r"I do not want to book a cabin",
                  re.I
              )

              buttons = page.get_by_role(
                  "button",
                  name=pattern
              )

              for i in range(buttons.count()):
                  try:
                      button = buttons.nth(i)

                      if (
                          button.is_visible()
                          and button.is_enabled()
                      ):
                          log(
                              "Clicking "
                              "'I do not want to book a cabin'"
                          )

                          button.click()

                          return
                  except Exception:
                      pass

              # Text fallback.
              for i in range(
                  page.locator("button").count()
              ):
                  try:
                      button = (
                          page.locator("button").nth(i)
                      )

                      if not button.is_visible():
                          continue

                      text = (
                          button.inner_text()
                          .strip()
                      )

                      if re.search(
                          r"I do not want to book a cabin",
                          text,
                          re.I
                      ):
                          button.click()
                          return

                  except Exception:
                      pass

              raise RuntimeError(
                  "Cabin selection button not found."
              )


          def date_present(text):
              lower = text.lower()

              return any(
                  value.lower() in lower
                  for value in DATE_VARIANTS
              )


          def contains_route(text, route):
              lower = text.lower()

              return (
                  route[0].lower() in lower
                  and route[1].lower() in lower
              )


          def availability_signal(text):
              lower = text.lower()

              negative = [
                  "no availability",
                  "no voyages",
                  "no sailings",
                  "no results",
                  "nothing found",
                  "not available",
                  "sold out",
                  "fully booked"
              ]

              positive = [
                  "available",
                  "availability",
                  "departure",
                  "sailing",
                  "voyage",
                  "price",
                  "nok",
                  "eur",
                  "gbp",
                  "usd"
              ]

              negative_hits = [
                  x for x in negative
                  if x in lower
              ]

              positive_hits = [
                  x for x in positive
                  if x in lower
              ]

              price = bool(
                  re.search(
                      r"(€|EUR|NOK|£|GBP|\$|USD)\s?\d",
                      text,
                      re.I
                  )
                  or
                  re.search(
                      r"\d[\d,.]*\s?"
                      r"(EUR|NOK|GBP|USD)",
                      text,
                      re.I
                  )
              )

              return (
                  not negative_hits
                  and (
                      price
                      or len(positive_hits) >= 3
                  )
              )


          def inspect(page, route):
              try:
                  text = page.locator(
                      "body"
                  ).inner_text(
                      timeout=30000
                  )
              except Exception:
                  text = ""

              log(
                  "----- FINAL PAGE -----"
              )

              log(
                  f"URL: {page.url}"
              )

              log(
                  f"Target date present: "
                  f"{date_present(text)}"
              )

              log(
                  f"Route present: "
                  f"{contains_route(text, route)}"
              )

              potential = (
                  date_present(text)
                  and availability_signal(text)
              )

              log(
                  f"Availability signal: "
                  f"{potential}"
              )

              print(text[:50000])

              screenshot(
                  page,
                  "result_"
                  + route[0]
                  + "_"
                  + route[1]
              )

              return potential


          def check_route(browser, route):
              context = browser.new_context(
                  viewport={
                      "width": 1440,
                      "height": 1000
                  },
                  locale="en-GB",
                  timezone_id="Europe/Oslo"
              )

              page = context.new_page()

              interesting_requests = []

              def request_handler(request):
                  url = request.url.lower()

                  if any(
                      key in url
                      for key in (
                          "booking",
                          "availability",
                          "voyage",
                          "sailing",
                          "search",
                          "graphql",
                          "api"
                      )
                  ):
                      interesting_requests.append(
                          {
                              "method": request.method,
                              "url": request.url
                          }
                      )

                      log(
                          "REQUEST "
                          + request.method
                          + " "
                          + request.url[:1000]
                      )

              page.on(
                  "request",
                  request_handler
              )

              try:
                  log("")
                  log("=" * 70)
                  log(
                      f"CHECKING "
                      f"{route[0]} -> {route[1]}"
                  )
                  log("=" * 70)

                  page.goto(
                      URL,
                      wait_until="domcontentloaded",
                      timeout=120000
                  )

                  page.wait_for_timeout(10000)

                  # Cookie banner.
                  try:
                      page.locator(
                          "#onetrust-accept-btn-handler"
                      ).click(
                          timeout=3000
                      )

                      page.wait_for_timeout(1000)

                  except Exception:
                      pass

                  screenshot(
                      page,
                      "before_"
                      + route[0]
                      + "_"
                      + route[1]
                  )

                  # IMPORTANT:
                  # This operates on the real page DOM.
                  # No iframe is used.
                  select_port(
                      page,
                      route[0],
                      0
                  )

                  select_port(
                      page,
                      route[1],
                      1
                  )

                  page.wait_for_timeout(1000)

                  set_target_date(page)

                  page.wait_for_timeout(1000)

                  old_url = page.url

                  click_no_cabin(page)

                  log(
                      "Cabin choice submitted."
                  )

                  # Allow frontend state, navigation and API
                  # calls to complete.
                  page.wait_for_timeout(12000)

                  try:
                      page.wait_for_load_state(
                          "networkidle",
                          timeout=20000
                      )
                  except Exception:
                      pass

                  page.wait_for_timeout(5000)

                  log(
                      f"URL after submission: "
                      f"{page.url}"
                  )

                  # Inspect page.
                  potential = inspect(
                      page,
                      route
                  )

                  # Save useful request information.
                  try:
                      with open(
                          "network_requests.txt",
                          "a",
                          encoding="utf-8"
                      ) as f:
                          f.write(
                              "\n"
                              + "=" * 80
                              + "\n"
                              + f"{route[0]} -> {route[1]}"
                              + "\n"
                          )

                          for item in (
                              interesting_requests
                          ):
                              f.write(
                                  item["method"]
                                  + " "
                                  + item["url"]
                                  + "\n"
                              )

                  except Exception:
                      pass

                  return {
                      "route": route,
                      "potential": potential,
                      "url": page.url
                  }

              except Exception as e:
                  log(
                      f"ERROR "
                      f"{route[0]} -> {route[1]}: "
                      f"{type(e).__name__}: {e}"
                  )

                  screenshot(
                      page,
                      "ERROR_"
                      + route[0]
                      + "_"
                      + route[1]
                  )

                  return {
                      "route": route,
                      "potential": False,
                      "error": str(e),
                      "url": page.url
                  }

              finally:
                  context.close()


          def main():
              log(
                  "Starting Hurtigruten monitor"
              )

              log(
                  f"Target date: {TARGET_DATE}"
              )

              found = []

              # Remove old diagnostic request file.
              try:
                  os.remove(
                      "network_requests.txt"
                  )
              except FileNotFoundError:
                  pass

              with sync_playwright() as p:
                  browser = p.chromium.launch(
                      headless=True
                  )

                  for route in ROUTES:
                      result = check_route(
                          browser,
                          route
                      )

                      if result.get("potential"):
                          found.append(result)

                  browser.close()

              if found:
                  with open(
                      "availability_found.txt",
                      "w",
                      encoding="utf-8"
                  ) as f:

                      f.write(
                          "Hurtigruten availability alert\n"
                      )

                      f.write(
                          f"Target date: "
                          f"{TARGET_DATE}\n\n"
                      )

                      for result in found:
                          route = result["route"]

                          f.write(
                              f"Route: "
                              f"{route[0]} -> "
                              f"{route[1]}\n"
                          )

                          f.write(
                              f"Booking page: "
                              f"{result.get('url', '')}\n\n"
                          )

                  log(
                      f"FOUND {len(found)} route(s)."
                  )

              else:
                  log(
                      "No availability detected."
                  )


          if __name__ == "__main__":
              main()
          PY

      - name: Run monitor
        run: python monitor.py

      - name: Send QQ email alert
        if: success() && hashFiles('availability_found.txt') != ''
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          from email.mime.text import MIMEText
          from email.header import Header

          user = os.environ["SMTP_USER"]
          password = os.environ["SMTP_PASSWORD"]
          recipient = os.environ["ALERT_EMAIL"]

          with open(
              "availability_found.txt",
              "r",
              encoding="utf-8"
          ) as f:
              body = f.read()

          message = MIMEText(
              body,
              "plain",
              "utf-8"
          )

          message["Subject"] = Header(
              "Hurtigruten 航次提醒",
              "utf-8"
          )

          message["From"] = user
          message["To"] = recipient

          with smtplib.SMTP_SSL(
              "smtp.qq.com",
              465,
              timeout=30
          ) as smtp:

              smtp.login(
                  user,
                  password
              )

              smtp.sendmail(
                  user,
                  [recipient],
                  message.as_string()
              )

          print(
              "QQ email sent successfully."
          )
          PY

      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hurtigruten-diagnostics
          path: |
            *.png
            availability_found.txt
            network_requests.txt
          if-no-files-found: ignore

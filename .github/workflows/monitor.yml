name: Hurtigruten Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Create monitor
        run: |
          cat > monitor.py <<'PY'
          import os
          import re
          import time
          import smtplib
          from email.mime.text import MIMEText
          from playwright.sync_api import sync_playwright, TimeoutError as PlaywrightTimeoutError

          TARGET_DATE = "2027-02-07"

          ROUTES = [
              ("Svolvær", "Skjervøy"),
              ("Svolvær", "Tromsø"),
              ("Bodø", "Tromsø"),
          ]

          URL = "https://www.hurtigruten.com/en/port-to-port"
          BOOKING_URL = "https://www.hurtigruten.com/en/port-to-port/booking"

          SMTP_USER = os.environ["SMTP_USER"]
          SMTP_PASSWORD = os.environ["SMTP_PASSWORD"]
          ALERT_EMAIL = os.environ["ALERT_EMAIL"]


          def send_email(subject, body):
              msg = MIMEText(body, "plain", "utf-8")
              msg["Subject"] = subject
              msg["From"] = SMTP_USER
              msg["To"] = ALERT_EMAIL

              with smtplib.SMTP_SSL("smtp.qq.com", 465, timeout=30) as server:
                  server.login(SMTP_USER, SMTP_PASSWORD)
                  server.sendmail(SMTP_USER, [ALERT_EMAIL], msg.as_string())


          def close_cookie_popup(page):
              selectors = [
                  "#onetrust-accept-btn-handler",
                  "#onetrust-reject-all-handler",
                  "button:has-text('Accept all')",
                  "button:has-text('Reject all')",
              ]

              for selector in selectors:
                  try:
                      loc = page.locator(selector)
                      if loc.count() > 0 and loc.first.is_visible():
                          loc.first.click(force=True, timeout=2000)
                          time.sleep(0.5)
                          break
                  except:
                      pass

              try:
                  page.locator(".onetrust-pc-dark-filter").evaluate_all(
                      "(els) => els.forEach(e => e.remove())"
                  )
              except:
                  pass

              try:
                  page.locator("#onetrust-consent-sdk").evaluate(
                      "(e) => e.style.pointerEvents='none'"
                  )
              except:
                  pass


          def get_frames(page):
              frames = [page]
              for frame in page.frames:
                  if frame != page:
                      frames.append(frame)
              return frames


          def find_port_input(page, field):
              selectors = []

              if field == "from":
                  selectors = [
                      'input[placeholder="Sail from where?"]',
                      'input[placeholder*="Sail from" i]',
                      'input[aria-label*="Sail from" i]',
                      'input[aria-label*="From" i]',
                  ]
              else:
                  selectors = [
                      'input[placeholder="Sail to where?"]',
                      'input[placeholder*="Sail to" i]',
                      'input[aria-label*="Sail to" i]',
                      'input[aria-label*="To" i]',
                  ]

              for frame in get_frames(page):
                  for selector in selectors:
                      try:
                          loc = frame.locator(selector)
                          if loc.count() > 0:
                              for i in range(loc.count()):
                                  item = loc.nth(i)
                                  if item.is_visible():
                                      return frame, item
                      except:
                          pass

              return None, None


          def select_port(page, port, field):
              close_cookie_popup(page)

              frame, inp = find_port_input(page, field)

              if inp is None:
                  raise RuntimeError(
                      f"Could not find {field} port input for {port}"
                  )

              inp.click(force=True)
              inp.fill("")
              inp.type(port, delay=80)

              time.sleep(1.5)

              # Try visible autocomplete options in the same frame.
              option_selectors = [
                  '[role="option"]:visible',
                  'li:visible',
                  '[data-testid*="option" i]:visible',
              ]

              for selector in option_selectors:
                  try:
                      options = frame.locator(selector)
                      for i in range(options.count()):
                          option = options.nth(i)
                          if not option.is_visible():
                              continue

                          text = option.inner_text().strip()

                          if port.lower() in text.lower():
                              option.click(force=True)
                              time.sleep(1)
                              return
                  except:
                      pass

              # Keyboard fallback.
              inp.press("ArrowDown")
              inp.press("Enter")
              time.sleep(1)


          def find_search_control(page):
              names = [
                  "Search",
                  "Search availability",
                  "Show availability",
                  "Find availability",
                  "Check availability",
                  "Continue",
                  "View availability",
                  "Find sailings",
              ]

              # IMPORTANT:
              # Search the iframe as well as the main page.
              for frame in get_frames(page):
                  for name in names:
                      try:
                          loc = frame.get_by_role(
                              "button",
                              name=re.compile(name, re.I)
                          )

                          if loc.count() > 0:
                              for i in range(loc.count()):
                                  b = loc.nth(i)
                                  if b.is_visible():
                                      return frame, b
                      except:
                          pass

                  # Submit buttons
                  for selector in [
                      'button[type="submit"]:visible',
                      'input[type="submit"]:visible',
                  ]:
                      try:
                          loc = frame.locator(selector)
                          if loc.count() > 0:
                              return frame, loc.first
                      except:
                          pass

              return None, None


          def dump_page(page, prefix):
              try:
                  page.screenshot(
                      path=f"{prefix}.png",
                      full_page=True
                  )
              except:
                  pass

              try:
                  with open(f"{prefix}.html", "w", encoding="utf-8") as f:
                      f.write(page.content())
              except:
                  pass

              try:
                  with open(f"{prefix}_frames.txt", "w", encoding="utf-8") as f:
                      for i, frame in enumerate(page.frames):
                          f.write(
                              f"\nFRAME {i}\n"
                              f"URL: {frame.url}\n"
                          )

                          try:
                              f.write(
                                  frame.locator("body").inner_text(
                                      timeout=3000
                                  )[:15000]
                              )
                          except:
                              pass
              except:
                  pass


          def date_text_found(text):
              t = text.lower()

              patterns = [
                  "07/02/2027",
                  "7/2/2027",
                  "07-02-2027",
                  "2027-02-07",
                  "7 february 2027",
                  "07 february 2027",
                  "7 feb 2027",
                  "07 feb 2027",
                  "february 7, 2027",
                  "feb 7, 2027",
              ]

              return any(p.lower() in t for p in patterns)


          def inspect_for_target(page):
              # Look through every frame because the booking widget is iframe based.
              for frame in get_frames(page):
                  try:
                      text = frame.locator("body").inner_text(timeout=3000)

                      if date_text_found(text):
                          return True

                      # Look for availability indicators.
                      positive = [
                          "available",
                          "availability",
                          "sailing",
                          "departure",
                          "book now",
                          "select",
                      ]

                      if any(x in text.lower() for x in positive):
                          # Do not immediately call this available.
                          # Only return true if target date is actually present.
                          pass

                  except:
                      pass

              return False


          def click_search(page):
              frame, button = find_search_control(page)

              if button is None:
                  dump_page(page, "search_button_missing")
                  raise RuntimeError(
                      "Could not find Search/Availability control in page or iframe"
                  )

              button.click(force=True)
              time.sleep(5)


          def check_route(page, from_port, to_port):
              page.goto(URL, wait_until="domcontentloaded", timeout=60000)
              page.wait_for_timeout(5000)

              close_cookie_popup(page)

              # The public Port-to-Port page contains the actual form.
              select_port(page, from_port, "from")
              select_port(page, to_port, "to")

              # Try the actual control inside the iframe.
              click_search(page)

              # Wait for navigation / booking widget update.
              page.wait_for_timeout(5000)

              # Save diagnostics regardless of result.
              safe_name = (
                  from_port.replace(" ", "_")
                  + "_"
                  + to_port.replace(" ", "_")
              )

              dump_page(page, safe_name)

              # Inspect all frames.
              if inspect_for_target(page):
                  return True

              # Also inspect current URL.
              current_url = page.url

              if TARGET_DATE in current_url:
                  return True

              # Search text in every frame for explicit target date.
              for frame in get_frames(page):
                  try:
                      body = frame.locator("body").inner_text(timeout=3000)

                      if TARGET_DATE in body:
                          return True

                      # Normalize whitespace.
                      normalized = re.sub(r"\s+", " ", body)

                      if date_text_found(normalized):
                          return True

                  except:
                      pass

              return False


          def main():
              errors = []
              available = []

              with sync_playwright() as p:
                  browser = p.chromium.launch(
                      headless=True,
                      args=[
                          "--disable-blink-features=AutomationControlled",
                      ],
                  )

                  context = browser.new_context(
                      viewport={"width": 1440, "height": 1000},
                      locale="en-GB",
                      timezone_id="Europe/Oslo",
                  )

                  page = context.new_page()

                  for from_port, to_port in ROUTES:
                      route = f"{from_port} -> {to_port}"

                      try:
                          print(f"Checking {route}")

                          result = check_route(
                              page,
                              from_port,
                              to_port
                          )

                          if result:
                              print(
                                  f"TARGET DATE FOUND: {route}"
                              )
                              available.append(route)
                          else:
                              print(
                                  f"No confirmed target date: {route}"
                              )

                      except Exception as e:
                          error = (
                              f"{type(e).__name__}: {e}"
                          )

                          print(
                              f"ERROR {route}: {error}"
                          )

                          errors.append(
                              f"{route}\n{error}"
                          )

                  browser.close()

              # Availability email.
              if available:
                  body = (
                      "Hurtigruten availability detected\n\n"
                      f"Target date: {TARGET_DATE}\n\n"
                      + "\n".join(
                          f"AVAILABLE: {r}"
                          for r in available
                      )
                      + "\n\n"
                      "Please check the Hurtigruten booking page."
                  )

                  send_email(
                      "Hurtigruten AVAILABLE",
                      body
                  )

              # Error email.
              if errors:
                  body = (
                      "Hurtigruten monitor ERROR\n\n"
                      f"Target date: {TARGET_DATE}\n\n"
                      + "\n\n".join(errors)
                  )

                  send_email(
                      "Hurtigruten monitor ERROR",
                      body
                  )

              # Do not fail GitHub Actions merely because
              # a route is temporarily unavailable.
              print("Monitor finished.")


          if __name__ == "__main__":
              main()
          PY

      - name: Run monitor
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          python monitor.py

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hurtigruten-diagnostics
          path: |
            *.png
            *.html
            *_frames.txt
            monitor.py
          if-no-files-found: ignore

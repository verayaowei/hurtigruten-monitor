name: Hurtigruten Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Create monitor
        run: |
          cat > monitor.py <<'PY'
          import os
          import re
          import ssl
          import smtplib
          import traceback
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          from playwright.sync_api import sync_playwright

          URL = "https://www.hurtigruten.com/en/port-to-port"
          TARGET_DATE = "2027-02-07"

          ROUTES = [
              ("Svolvær", "Skjervøy", "svolvaer-skjer"),
              ("Svolvær", "Tromsø", "svolvaer-tromso"),
              ("Bodø", "Tromsø", "bodo-tromso"),
          ]

          SMTP_USER = os.environ["SMTP_USER"]
          SMTP_PASSWORD = os.environ["SMTP_PASSWORD"]
          ALERT_EMAIL = os.environ["ALERT_EMAIL"]


          def send_mail(subject, body):
              msg = MIMEMultipart()
              msg["From"] = SMTP_USER
              msg["To"] = ALERT_EMAIL
              msg["Subject"] = subject
              msg.attach(MIMEText(body, "plain", "utf-8"))

              with smtplib.SMTP_SSL(
                  "smtp.qq.com",
                  465,
                  context=ssl.create_default_context(),
                  timeout=30
              ) as server:
                  server.login(SMTP_USER, SMTP_PASSWORD)
                  server.sendmail(
                      SMTP_USER,
                      [ALERT_EMAIL],
                      msg.as_string()
                  )


          def clean(text):
              return re.sub(r"\s+", " ", text or "").strip()


          def close_cookie_popup(page):
              """
              Hurtigruten uses OneTrust.
              The overlay:
              onetrust-pc-dark-filter
              can intercept all pointer events.
              """

              print("Checking cookie popup...")

              # Accept/reject buttons used by OneTrust.
              selectors = [
                  "#onetrust-accept-btn-handler",
                  "#onetrust-reject-all-handler",
                  "button#onetrust-accept-btn-handler",
                  "button#onetrust-reject-all-handler",
              ]

              for selector in selectors:
                  try:
                      button = page.locator(selector).first

                      if button.is_visible(timeout=2000):
                          print(
                              f"Cookie button found: {selector}"
                          )

                          button.click(
                              force=True,
                              timeout=10000
                          )

                          page.wait_for_timeout(1500)
                          print("Cookie popup closed.")
                          return
                  except Exception:
                      pass

              # Sometimes the popup has already been handled
              # but the overlay remains for a short time.
              try:
                  page.locator(
                      "#onetrust-pc-sdk"
                  ).evaluate(
                      "(e) => e.remove()"
                  )
              except Exception:
                  pass

              try:
                  page.locator(
                      "#onetrust-consent-sdk"
                  ).evaluate(
                      """
                      (e) => {
                          e.style.pointerEvents = 'none';
                      }
                      """
                  )
              except Exception:
                  pass

              try:

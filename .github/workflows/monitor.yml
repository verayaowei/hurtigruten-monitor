name: Hurtigruten Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Create monitor
        run: |
          cat > monitor.py <<'PY'
          import os
          import re
          import time
          import smtplib
          from email.mime.text import MIMEText
          from playwright.sync_api import sync_playwright

          TARGET_DATE = "2027-02-07"

          ROUTES = [
              ("Svolvær", "Skjervøy"),
              ("Svolvær", "Tromsø"),
              ("Bodø", "Tromsø"),
          ]

          URL = "https://www.hurtigruten.com/en/port-to-port"

          SMTP_USER = os.environ["SMTP_USER"]
          SMTP_PASSWORD = os.environ["SMTP_PASSWORD"]
          ALERT_EMAIL = os.environ["ALERT_EMAIL"]


          def send_email(subject, body):
              msg = MIMEText(body, "plain", "utf-8")
              msg["Subject"] = subject
              msg["From"] = SMTP_USER
              msg["To"] = ALERT_EMAIL

              with smtplib.SMTP_SSL("smtp.qq.com", 465, timeout=30) as server:
                  server.login(SMTP_USER, SMTP_PASSWORD)
                  server.sendmail(
                      SMTP_USER,
                      [ALERT_EMAIL],
                      msg.as_string()
                  )


          def close_cookie_popup(page):
              selectors = [
                  "#onetrust-accept-btn-handler",
                  "#onetrust-reject-all-handler",
                  "button:has-text('Accept all')",
                  "button:has-text('Reject all')",
              ]

              for selector in selectors:
                  try:
                      loc = page.locator(selector)
                      for i in range(loc.count()):
                          x = loc.nth(i)
                          if x.is_visible():
                              x.click(force=True, timeout=2000)
                              time.sleep(0.5)
                              return
                  except:
                      pass

              try:
                  page.locator(".onetrust-pc-dark-filter").evaluate_all(
                      "(els) => els.forEach(e => e.remove())"
                  )
              except:
                  pass


          def all_frames(page):
              return [page] + [
                  f for f in page.frames if f != page
              ]


          def find_port_input(page, field):
              if field == "from":
                  selectors = [
                      'input[placeholder="Sail from where?"]',
                      'input[placeholder*="Sail from" i]',
                      'input[aria-label*="Sail from" i]',
                  ]
              else:
                  selectors = [
                      'input[placeholder="Sail to where?"]',
                      'input[placeholder*="Sail to" i]',
                      'input[aria-label*="Sail to" i]',
                  ]

              for frame in all_frames(page):
                  for selector in selectors:
                      try:
                          loc = frame.locator(selector)

                          for i in range(loc.count()):
                              x = loc.nth(i)

                              if x.is_visible():
                                  return frame, x
                      except:
                          pass

              return None, None


          def select_port(page, port, field):
              close_cookie_popup(page)

              frame, inp = find_port_input(page, field)

              if inp is None:
                  raise RuntimeError(
                      f"Cannot find {field} port input: {port}"
                  )

              inp.click(force=True)
              inp.fill("")
              inp.type(port, delay=60)

              time.sleep(1.5)

              for selector in [
                  '[role="option"]:visible',
                  'li:visible',
                  '[data-testid*="option" i]:visible',
              ]:
                  try:
                      loc = frame.locator(selector)

                      for i in range(loc.count()):
                          x = loc.nth(i)

                          if not x.is_visible():
                              continue

                          text = x.inner_text().strip()

                          if port.lower() in text.lower():
                              x.click(force=True)
                              time.sleep(1)
                              return
                  except:
                      pass

              inp.press("ArrowDown")
              inp.press("Enter")
              time.sleep(1)


          def find_date_input(page):
              # The diagnostic file showed the real date field
              # as an INPUT whose current value was 06/09/2026.
              selectors = [
                  'input[type="date"]',
                  'input[value="06/09/2026"]',
                  'input[placeholder*="date" i]',
                  'input[aria-label*="date" i]',
              ]

              for frame in all_frames(page):
                  for selector in selectors:
                      try:
                          loc = frame.locator(selector)

                          for i in range(loc.count()):
                              x = loc.nth(i)

                              if x.is_visible():
                                  return frame, x
                      except:
                          pass

              # Last resort: identify the visible input whose
              # value looks like a date.
              for frame in all_frames(page):
                  try:
                      inputs = frame.locator("input:visible")

                      for i in range(inputs.count()):
                          x = inputs.nth(i)

                          value = x.input_value()

                          if re.match(
                              r"^\d{1,2}/\d{1,2}/\d{4}$",
                              value
                          ):
                              return frame, x
                  except:
                      pass

              return None, None


          def set_target_date(page):
              frame, date_input = find_date_input(page)

              if date_input is None:
                  raise RuntimeError(
                      "Cannot find departure date input"
                  )

              # Native date input.
              try:
                  date_input.fill("2027-02-07")
              except:
                  # Text date input.
                  date_input.click(force=True)
                  date_input.press("Control+A")
                  date_input.type("07/02/2027")
              
              date_input.press("Tab")
              time.sleep(1)

              value = date_input.input_value()

              print("DATE FIELD VALUE:", value)

              # Accept both native ISO and localized format.
              if (
                  "2027-02-07" not in value
                  and "07/02/2027" not in value
                  and "7/2/2027" not in value
              ):
                  raise RuntimeError(
                      f"Failed to set target date. "
                      f"Actual value: {value}"
                  )


          def choose_no_cabin(page):
              for frame in all_frames(page):
                  selectors = [
                      "button:has-text('I do not want to book a cabin')",
                      "text=I do not want to book a cabin",
                  ]

                  for selector in selectors:
                      try:
                          loc = frame.locator(selector)

                          for i in range(loc.count()):
                              x = loc.nth(i)

                              if x.is_visible():
                                  x.click(force=True)
                                  time.sleep(1)
                                  return True
                      except:
                          pass

              return False


          def find_form(page):
              for frame in all_frames(page):
                  try:
                      forms = frame.locator("form")

                      for i in range(forms.count()):
                          form = forms.nth(i)

                          if form.is_visible():
                              return frame, form
                  except:
                      pass

              return None, None


          def submit_form(page):
              frame, form = find_form(page)

              if form is None:
                  # Try Enter from the date field.
                  _, date_input = find_date_input(page)

                  if date_input is not None:
                      date_input.press("Enter")
                      time.sleep(6)
                      return

                  raise RuntimeError(
                      "Cannot find booking form"
                  )

              # Submit the actual HTML form rather than guessing
              # the button text.
              try:
                  form.evaluate(
                      "(f) => f.requestSubmit()"
                  )
              except:
                  try:
                      form.locator(
                          'button[type="submit"], input[type="submit"]'
                      ).first.click(force=True)
                  except:
                      date_input = find_date_input(page)[1]

                      if date_input is None:
                          raise RuntimeError(
                              "Cannot submit booking form"
                          )

                      date_input.press("Enter")

              time.sleep(8)


          def collect_page_text(page):
              text = []

              for frame in all_frames(page):
                  try:
                      text.append(
                          frame.locator("body").inner_text(
                              timeout=5000
                          )
                      )
                  except:
                      pass

              return "\n".join(text)


          def target_date_in_text(text):
              normalized = re.sub(r"\s+", " ", text).lower()

              patterns = [
                  "07/02/2027",
                  "7/2/2027",
                  "07-02-2027",
                  "2027-02-07",
                  "7 february 2027",
                  "07 february 2027",
                  "7 feb 2027",
                  "07 feb 2027",
                  "february 7, 2027",
                  "feb 7, 2027",
              ]

              return any(
                  p.lower() in normalized
                  for p in patterns
              )


          def availability_words(text):
              t = text.lower()

              positive = [
                  "available",
                  "book now",
                  "select sailing",
                  "select departure",
                  "departure",
                  "sailing",
              ]

              negative = [
                  "sold out",
                  "fully booked",
                  "no availability",
                  "not available",
                  "unavailable",
              ]

              has_positive = any(
                  x in t for x in positive
              )

              has_negative = any(
                  x in t for x in negative
              )

              return has_positive and not has_negative


          def save_diagnostic(page, name):
              try:
                  page.screenshot(
                      path=f"{name}.png",
                      full_page=True
                  )
              except:
                  pass

              try:
                  with open(
                      f"{name}.html",
                      "w",
                      encoding="utf-8"
                  ) as f:
                      f.write(page.content())
              except:
                  pass


          def check_route(page, from_port, to_port):
              page.goto(
                  URL,
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              page.wait_for_timeout(5000)
              close_cookie_popup(page)

              select_port(
                  page,
                  from_port,
                  "from"
              )

              select_port(
                  page,
                  to_port,
                  "to"
              )

              print(
                  f"PORTS OK: {from_port} -> {to_port}"
              )

              set_target_date(page)

              print(
                  f"DATE OK: {TARGET_DATE}"
              )

              choose_no_cabin(page)

              submit_form(page)

              print(
                  "RESULT URL:",
                  page.url
              )

              text = collect_page_text(page)

              safe = (
                  from_port.replace(" ", "_")
                  + "_"
                  + to_port.replace(" ", "_")
              )

              save_diagnostic(
                  page,
                  safe
              )

              print(
                  "RESULT TEXT:",
                  text[:10000]
              )

              # Strict target-date requirement.
              if target_date_in_text(text):
                  return True

              # Also accept the target date in the resulting URL.
              if TARGET_DATE in page.url:
                  return True

              return False


          def main():
              available = []
              errors = []

              with sync_playwright() as p:
                  browser = p.chromium.launch(
                      headless=True
                  )

                  context = browser.new_context(
                      viewport={
                          "width": 1440,
                          "height": 1000
                      },
                      locale="en-GB",
                      timezone_id="Europe/Oslo",
                  )

                  page = context.new_page()

                  for from_port, to_port in ROUTES:
                      route = (
                          f"{from_port} -> {to_port}"
                      )

                      try:
                          print(
                              "\nCHECKING:",
                              route
                          )

                          found = check_route(
                              page,
                              from_port,
                              to_port
                          )

                          if found:
                              available.append(route)
                              print(
                                  "TARGET DATE FOUND:",
                                  route
                              )
                          else:
                              print(
                                  "NO CONFIRMED TARGET DATE:",
                                  route
                              )

                      except Exception as e:
                          error = (
                              f"{type(e).__name__}: {e}"
                          )

                          print(
                              "ERROR:",
                              route,
                              error
                          )

                          errors.append(
                              f"{route}\n{error}"
                          )

                  browser.close()

              if available:
                  body = (
                      "Hurtigruten availability detected\n\n"
                      f"Target date: {TARGET_DATE}\n\n"
                      + "\n".join(
                          "AVAILABLE: " + x
                          for x in available
                      )
                      + "\n\n"
                      "Please check Hurtigruten immediately."
                  )

                  send_email(
                      "Hurtigruten AVAILABLE",
                      body
                  )

              if errors:
                  body = (
                      "Hurtigruten monitor ERROR\n\n"
                      f"Target date: {TARGET_DATE}\n\n"
                      + "\n\n".join(errors)
                  )

                  send_email(
                      "Hurtigruten monitor ERROR",
                      body
                  )

              print("MONITOR FINISHED")


          if __name__ == "__main__":
              main()
          PY

      - name: Run monitor
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          python monitor.py

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hurtigruten-monitor-diagnostics
          path: |
            *.png
            *.html
            monitor.py
          if-no-files-found: ignore

name: Hurtigruten Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Create diagnostic monitor
        run: |
          cat > monitor.py <<'PY'
          import os
          import time
          import re
          import smtplib
          from email.mime.text import MIMEText
          from playwright.sync_api import sync_playwright

          TARGET_DATE = "2027-02-07"

          ROUTES = [
              ("Svolvær", "Skjervøy"),
              ("Svolvær", "Tromsø"),
              ("Bodø", "Tromsø"),
          ]

          URL = "https://www.hurtigruten.com/en/port-to-port"

          SMTP_USER = os.environ["SMTP_USER"]
          SMTP_PASSWORD = os.environ["SMTP_PASSWORD"]
          ALERT_EMAIL = os.environ["ALERT_EMAIL"]


          def send_email(subject, body):
              msg = MIMEText(body, "plain", "utf-8")
              msg["Subject"] = subject
              msg["From"] = SMTP_USER
              msg["To"] = ALERT_EMAIL

              with smtplib.SMTP_SSL(
                  "smtp.qq.com",
                  465,
                  timeout=30
              ) as s:
                  s.login(SMTP_USER, SMTP_PASSWORD)
                  s.sendmail(
                      SMTP_USER,
                      [ALERT_EMAIL],
                      msg.as_string()
                  )


          def close_cookie_popup(page):
              selectors = [
                  "#onetrust-accept-btn-handler",
                  "#onetrust-reject-all-handler",
                  "button:has-text('Accept all')",
                  "button:has-text('Reject all')",
              ]

              for selector in selectors:
                  try:
                      loc = page.locator(selector)

                      if loc.count() > 0:
                          for i in range(loc.count()):
                              x = loc.nth(i)

                              if x.is_visible():
                                  x.click(
                                      force=True,
                                      timeout=2000
                                  )
                                  break
                  except:
                      pass

              try:
                  page.locator(
                      ".onetrust-pc-dark-filter"
                  ).evaluate_all(
                      "(x) => x.forEach(e => e.remove())"
                  )
              except:
                  pass


          def frames(page):
              result = [page]

              for f in page.frames:
                  if f != page:
                      result.append(f)

              return result


          def find_input(page, field):
              if field == "from":
                  selectors = [
                      'input[placeholder="Sail from where?"]',
                      'input[placeholder*="Sail from" i]',
                      'input[aria-label*="Sail from" i]',
                  ]
              else:
                  selectors = [
                      'input[placeholder="Sail to where?"]',
                      'input[placeholder*="Sail to" i]',
                      'input[aria-label*="Sail to" i]',
                  ]

              for frame in frames(page):
                  for selector in selectors:
                      try:
                          loc = frame.locator(selector)

                          for i in range(loc.count()):
                              x = loc.nth(i)

                              if x.is_visible():
                                  return frame, x
                      except:
                          pass

              return None, None


          def select_port(page, port, field):
              close_cookie_popup(page)

              frame, inp = find_input(page, field)

              if inp is None:
                  raise RuntimeError(
                      f"Cannot find {field} input: {port}"
                  )

              inp.click(force=True)
              inp.fill("")
              inp.type(port, delay=80)

              time.sleep(2)

              # First try exact visible text.
              for selector in [
                  '[role="option"]:visible',
                  'li:visible',
                  '[data-testid*="option" i]:visible',
              ]:
                  try:
                      loc = frame.locator(selector)

                      for i in range(loc.count()):
                          x = loc.nth(i)

                          if not x.is_visible():
                              continue

                          text = x.inner_text().strip()

                          if port.lower() in text.lower():
                              x.click(force=True)
                              time.sleep(1)
                              return
                  except:
                      pass

              inp.press("ArrowDown")
              inp.press("Enter")
              time.sleep(1)


          def dump(page):
              try:
                  page.screenshot(
                      path="diagnostic.png",
                      full_page=True
                  )
              except:
                  pass

              try:
                  with open(
                      "diagnostic.html",
                      "w",
                      encoding="utf-8"
                  ) as f:
                      f.write(page.content())
              except:
                  pass

              with open(
                  "diagnostic_frames.txt",
                  "w",
                  encoding="utf-8"
              ) as f:

                  for n, frame in enumerate(frames(page)):
                      f.write(
                          "\n==============================\n"
                      )
                      f.write(
                          f"FRAME {n}\n"
                      )
                      f.write(
                          f"URL: {frame.url}\n\n"
                      )

                      try:
                          f.write(
                              frame.locator(
                                  "body"
                              ).inner_text(
                                  timeout=5000
                              )[:30000]
                          )
                      except Exception as e:
                          f.write(
                              f"\nBODY ERROR: {e}\n"
                          )

                      f.write("\n")


          def inspect_elements(page):
              result = []

              for n, frame in enumerate(frames(page)):
                  try:
                      buttons = frame.locator(
                          "button, a, input, [role='button']"
                      )

                      for i in range(
                          min(buttons.count(), 300)
                      ):
                          x = buttons.nth(i)

                          try:
                              if not x.is_visible():
                                  continue

                              text = (
                                  x.inner_text()
                                  .strip()
                              )

                              aria = (
                                  x.get_attribute(
                                      "aria-label"
                                  ) or ""
                              )

                              title = (
                                  x.get_attribute(
                                      "title"
                                  ) or ""
                              )

                              value = (
                                  x.get_attribute(
                                      "value"
                                  ) or ""
                              )

                              result.append(
                                  f"FRAME {n} | "
                                  f"TAG={x.evaluate('(e)=>e.tagName')} | "
                                  f"TEXT={text!r} | "
                                  f"ARIA={aria!r} | "
                                  f"TITLE={title!r} | "
                                  f"VALUE={value!r}"
                              )
                          except:
                              pass

                  except:
                      pass

              with open(
                  "diagnostic_elements.txt",
                  "w",
                  encoding="utf-8"
              ) as f:
                  f.write(
                      "\n".join(result)
                  )


          def main():
              logs = []

              with sync_playwright() as p:

                  browser = p.chromium.launch(
                      headless=True
                  )

                  context = browser.new_context(
                      viewport={
                          "width": 1440,
                          "height": 1000
                      },
                      locale="en-GB",
                      timezone_id="Europe/Oslo",
                  )

                  page = context.new_page()

                  # Record every navigation.
                  page.on(
                      "framenavigated",
                      lambda frame:
                      print(
                          "NAVIGATION:",
                          frame.url
                      )
                  )

                  # Record requests.
                  def request_handler(req):
                      u = req.url.lower()

                      if any(
                          x in u
                          for x in [
                              "search",
                              "booking",
                              "availability",
                              "sailing",
                              "journey",
                              "api",
                              "graphql"
                          ]
                      ):
                          print(
                              "REQUEST:",
                              req.method,
                              req.url
                          )

                  page.on(
                      "request",
                      request_handler
                  )

                  for from_port, to_port in ROUTES:

                      route = (
                          f"{from_port} -> {to_port}"
                      )

                      print(
                          "\n\n==========",
                          route,
                          "=========="
                      )

                      try:
                          page.goto(
                              URL,
                              wait_until="domcontentloaded",
                              timeout=60000
                          )

                          page.wait_for_timeout(5000)

                          close_cookie_popup(page)

                          select_port(
                              page,
                              from_port,
                              "from"
                          )

                          select_port(
                              page,
                              to_port,
                              "to"
                          )

                          print(
                              "PORTS SELECTED:",
                              route
                          )

                          # IMPORTANT:
                          # Do NOT guess the button.
                          # Record the complete live page structure.
                          inspect_elements(page)
                          dump(page)

                          # Try natural keyboard submission.
                          # This allows forms to submit without knowing
                          # the button's label.
                          for frame in frames(page):

                              try:
                                  body = frame.locator(
                                      "body"
                                  )

                                  body.click(
                                      position={
                                          "x": 10,
                                          "y": 10
                                      },
                                      force=True
                                  )

                                  frame.locator(
                                      "body"
                                  ).press(
                                      "Enter"
                                  )

                              except:
                                  pass

                          page.wait_for_timeout(8000)

                          print(
                              "AFTER ENTER URL:",
                              page.url
                          )

                          inspect_elements(page)
                          dump(page)

                      except Exception as e:

                          text = (
                              f"{route}: "
                              f"{type(e).__name__}: {e}"
                          )

                          print(text)
                          logs.append(text)

                  browser.close()

              body = (
                  "Hurtigruten diagnostic run\n\n"
                  f"Target date: {TARGET_DATE}\n\n"
                  + "\n".join(logs)
                  + "\n\n"
                  "IMPORTANT: This run records the actual "
                  "booking page controls and URLs."
              )

              send_email(
                  "Hurtigruten diagnostic",
                  body
              )


          if __name__ == "__main__":
              main()
          PY

      - name: Run diagnostic
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          python monitor.py

      - name: Upload diagnostic files
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hurtigruten-real-page-diagnostics
          path: |
            diagnostic.png
            diagnostic.html
            diagnostic_frames.txt
            diagnostic_elements.txt
            monitor.py
          if-no-files-found: ignore

name: Hurtigruten Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Create monitor
        run: |
          cat > monitor.py <<'PY'
          import base64
          import json
          import os
          import re
          import subprocess
          from datetime import datetime, timezone, timedelta
          from playwright.sync_api import sync_playwright

          TARGET_DATE = "2027-02-07"

          ROUTES = [
              ("Svolvær", "SVJ", "Skjervøy", "SRY"),
              ("Svolvær", "SVJ", "Tromsø", "TOS"),
              ("Bodø", "BOO", "Tromsø", "TOS"),
          ]

          BOOKING_URL = "https://www.hurtigruten.com/en/port-to-port/booking"

          STATE_FILE = "monitor_state.json"

          def log(msg):
              print(
                  f"[{datetime.now(timezone.utc).isoformat()}] {msg}",
                  flush=True
              )

          def make_search_url(from_code, to_code):
              data = {
                  "locale": "en",
                  "searchUnit": "day",
                  "startDate": TARGET_DATE + "T00:00:00.000Z",
                  "endDate": TARGET_DATE + "T23:59:59.000Z",
                  "promotionCode": None,
                  "fromPort": from_code,
                  "toPort": to_code,
                  "vehicles": {
                      "cars": 0,
                      "motorcycles": 0
                  },
                  "cabins": [{
                      "adults": 1,
                      "children": 0,
                      "infants": 0,
                      "companions": 0,
                      "students": 0,
                      "seniors": 0,
                      "militaryServicePersons": 0,
                      "wheelchairs": 0,
                      "pets": 0
                  }],
                  "travelType": "deckspace",
                  "voyageSlug": "",
                  "isRoundtrip": False,
                  "isDeckSpace": True
              }

              raw = json.dumps(
                  data,
                  separators=(",", ":"),
                  ensure_ascii=False
              ).encode("utf-8")

              encoded = base64.urlsafe_b64encode(raw).decode("ascii")

              return BOOKING_URL + "?searchData=" + encoded

          def load_state():
              if not os.path.exists(STATE_FILE):
                  return {}

              try:
                  with open(STATE_FILE, "r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return {}

          def save_state(state):
              with open(STATE_FILE, "w", encoding="utf-8") as f:
                  json.dump(
                      state,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

          def normalize(text):
              return re.sub(r"\s+", " ", text).strip()

          def find_target_date(text):
              patterns = [
                  r"07[./-]02[./-]2027",
                  r"2027[./-]02[./-]07",
                  r"Feb(?:ruary)?\s+7(?:,|\s+)2027",
                  r"7\s+Feb(?:ruary)?\s+2027",
              ]

              for pattern in patterns:
                  if re.search(pattern, text, re.I):
                      return True

              return False

          def extract_prices(text):
              patterns = [
                  r"(?:€|EUR|NOK|£|GBP|\$|USD)\s?[\d,.]+",
                  r"[\d,.]+\s?(?:EUR|NOK|GBP|USD)"
              ]

              found = []

              for pattern in patterns:
                  found.extend(re.findall(pattern, text, re.I))

              result = []
              seen = set()

              for item in found:
                  item = normalize(item)
                  if item not in seen:
                      seen.add(item)
                      result.append(item)

              return result[:20]

          def inspect_page(page, route):
              text = page.locator("body").inner_text(timeout=60000)
              text = normalize(text)

              lower = text.lower()

              log("")
              log("=" * 80)
              log(f"RESULT: {route[0]} -> {route[2]}")
              log(f"URL: {page.url}")
              log(f"TITLE: {page.title()}")
              log("=" * 80)

              print(text[:50000])

              has_target_date = find_target_date(text)
              prices = extract_prices(text)

              no_result_words = [
                  "no availability",
                  "no voyages",
                  "no sailings",
                  "no results",
                  "not available",
                  "sold out",
                  "nothing found"
              ]

              positive_words = [
                  "departure",
                  "sailing",
                  "voyage",
                  "available",
                  "price",
                  "select departure"
              ]

              negatives = [
                  x for x in no_result_words
                  if x in lower
              ]

              positives = [
                  x for x in positive_words
                  if x in lower
              ]

              log(f"Target date detected: {has_target_date}")
              log(f"Positive terms: {positives}")
              log(f"Negative terms: {negatives}")
              log(f"Prices: {prices}")

              # 必须确认目标日期出现。
              if not has_target_date:
                  return {
                      "available": False,
                      "fingerprint": None,
                      "text": text[:12000]
                  }

              # 明确显示无结果，则认为没有票。
              if negatives:
                  return {
                      "available": False,
                      "fingerprint": None,
                      "text": text[:12000]
                  }

              # 有价格 + 航次相关内容，才认为可能有可售航次。
              if prices and len(positives) >= 2:
                  fingerprint_source = (
                      route[1] + "|" +
                      route[3] + "|" +
                      TARGET_DATE + "|" +
                      "|".join(prices)
                  )

                  fingerprint = base64.b64encode(
                      fingerprint_source.encode()
                  ).decode()

                  return {
                      "available": True,
                      "fingerprint": fingerprint,
                      "prices": prices,
                      "text": text[:12000]
                  }

              return {
                  "available": False,
                  "fingerprint": None,
                  "text": text[:12000]
              }

          def check_route(browser, route):
              from_name, from_code, to_name, to_code = route

              url = make_search_url(from_code, to_code)

              log("")
              log("#" * 80)
              log(f"CHECKING {from_name} -> {to_name}")
              log(f"FROM CODE: {from_code}")
              log(f"TO CODE:   {to_code}")
              log(f"URL: {url}")
              log("#" * 80)

              context = browser.new_context(
                  viewport={"width": 1440, "height": 1000},
                  locale="en-GB",
                  timezone_id="Europe/Oslo"
              )

              page = context.new_page()

              try:
                  page.goto(
                      url,
                      wait_until="domcontentloaded",
                      timeout=120000
                  )

                  page.wait_for_timeout(12000)

                  result = inspect_page(page, route)

                  return {
                      "route": route,
                      "url": page.url,
                      **result
                  }

              except Exception as e:
                  log(
                      f"Route check failed: "
                      f"{type(e).__name__}: {e}"
                  )

                  return {
                      "route": route,
                      "url": page.url,
                      "available": False,
                      "fingerprint": None,
                      "error": str(e)
                  }

              finally:
                  context.close()

          def main():
              log("Starting Hurtigruten monitor")
              log(f"Target date: {TARGET_DATE}")

              state = load_state()
              alerts = []

              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True)

                  for route in ROUTES:
                      result = check_route(browser, route)

                      key = (
                          route[1] +
                          "_" +
                          route[3] +
                          "_" +
                          TARGET_DATE
                      )

                      old = state.get(key)

                      if result.get("available"):
                          fingerprint = result.get("fingerprint")

                          log(
                              f"AVAILABLE: "
                              f"{route[0]} -> {route[2]}"
                          )

                          if not old or old.get("fingerprint") != fingerprint:
                              alerts.append(result)

                          state[key] = {
                              "fingerprint": fingerprint,
                              "last_seen": datetime.now(
                                  timezone.utc
                              ).isoformat()
                          }

                      else:
                          log(
                              f"No availability: "
                              f"{route[0]} -> {route[2]}"
                          )

                          # 航次消失后清除状态。
                          # 下一次重新出现时重新报警。
                          state.pop(key, None)

                  browser.close()

              save_state(state)

              if alerts:
                  with open(
                      "availability_found.txt",
                      "w",
                      encoding="utf-8"
                  ) as f:

                      f.write(
                          "Hurtigruten Port-to-Port availability alert\n"
                      )
                      f.write(
                          f"Target date: {TARGET_DATE}\n\n"
                      )

                      for item in alerts:
                          route = item["route"]

                          f.write(
                              f"Route: "
                              f"{route[0]} -> {route[2]}\n"
                          )

                          f.write(
                              f"From code: {route[1]}\n"
                          )

                          f.write(
                              f"To code: {route[3]}\n"
                          )

                          f.write(
                              "Prices: "
                              + ", ".join(
                                  item.get("prices", [])
                              )
                              + "\n"
                          )

                          f.write(
                              f"Booking URL:\n"
                              f"{item['url']}\n\n"
                          )

                  log(
                      f"NEW availability found: "
                      f"{len(alerts)} route(s)"
                  )

              else:
                  log("No NEW availability.")

          if __name__ == "__main__":
              main()
          PY

      - name: Run monitor
        run: python monitor.py

      - name: Send QQ email alert
        if: success() && hashFiles('availability_found.txt') != ''
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          from email.mime.text import MIMEText
          from email.header import Header

          user = os.environ["SMTP_USER"]
          password = os.environ["SMTP_PASSWORD"]
          recipient = os.environ["ALERT_EMAIL"]

          with open(
              "availability_found.txt",
              "r",
              encoding="utf-8"
          ) as f:
              body = f.read()

          message = MIMEText(
              body,
              "plain",
              "utf-8"
          )

          message["Subject"] = Header(
              "Hurtigruten 航次提醒",
              "utf-8"
          )

          message["From"] = user
          message["To"] = recipient

          print(
              f"Sending alert to {recipient}"
          )

          with smtplib.SMTP_SSL(
              "smtp.qq.com",
              465,
              timeout=30
          ) as smtp:
              smtp.login(
                  user,
                  password
              )

              smtp.sendmail(
                  user,
                  [recipient],
                  message.as_string()
              )

          print(
              "QQ email sent successfully."
          )
          PY

      - name: Save monitor state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f monitor_state.json ]; then
            git add monitor_state.json

            if ! git diff --cached --quiet; then
              git commit -m "Update Hurtigruten monitor state"
              git push
            fi
          fi

      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hurtigruten-diagnostics
          path: |
            availability_found.txt
            monitor_state.json
          if-no-files-found: ignore

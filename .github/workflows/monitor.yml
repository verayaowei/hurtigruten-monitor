name: Hurtigruten Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Create monitor
        run: |
          cat > monitor.py <<'PY'
          import os
          import re
          import ssl
          import smtplib
          import traceback
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          from playwright.sync_api import sync_playwright

          URL = "https://www.hurtigruten.com/en/port-to-port"
          BOOKING_URL = "https://www.hurtigruten.com/en/port-to-port/booking"
          TARGET_DATE = "2027-02-07"

          ROUTES = [
              ("Svolvær", "Skjervøy", "svolvaer-skjer"),
              ("Svolvær", "Tromsø", "svolvaer-tromso"),
              ("Bodø", "Tromsø", "bodo-tromso"),
          ]

          SMTP_USER = os.environ["SMTP_USER"]
          SMTP_PASSWORD = os.environ["SMTP_PASSWORD"]
          ALERT_EMAIL = os.environ["ALERT_EMAIL"]


          def send_mail(subject, body):
              msg = MIMEMultipart()
              msg["From"] = SMTP_USER
              msg["To"] = ALERT_EMAIL
              msg["Subject"] = subject
              msg.attach(MIMEText(body, "plain", "utf-8"))

              with smtplib.SMTP_SSL(
                  "smtp.qq.com",
                  465,
                  context=ssl.create_default_context(),
                  timeout=30
              ) as server:
                  server.login(
                      SMTP_USER,
                      SMTP_PASSWORD
                  )
                  server.sendmail(
                      SMTP_USER,
                      [ALERT_EMAIL],
                      msg.as_string()
                  )


          def close_cookie_popup(page):
              selectors = [
                  "#onetrust-accept-btn-handler",
                  "#onetrust-reject-all-handler",
              ]

              for selector in selectors:
                  try:
                      button = page.locator(selector).first

                      if button.is_visible(timeout=1500):
                          button.click(
                              force=True,
                              timeout=10000
                          )
                          page.wait_for_timeout(1000)
                          return
                  except Exception:
                      pass

              try:
                  page.locator(
                      ".onetrust-pc-dark-filter"
                  ).evaluate_all(
                      "els => els.forEach(e => e.remove())"
                  )
              except Exception:
                  pass

              try:
                  page.locator(
                      "#onetrust-consent-sdk"
                  ).evaluate(
                      "e => e.style.pointerEvents='none'"
                  )
              except Exception:
                  pass


          def get_port_input(page, field):
              """
              IMPORTANT:
              Never use page.locator('input').first here.
              The site contains a hidden 'Search for anything'
              input before the port inputs.
              """

              if field == "from":
                  selectors = [
                      'input[placeholder="Sail from where?"]',
                      'input[placeholder*="Sail from" i]',
                      'input[aria-label*="Sail from" i]',
                  ]
              else:
                  selectors = [
                      'input[placeholder="Sail to where?"]',
                      'input[placeholder*="Sail to" i]',
                      'input[aria-label*="Sail to" i]',
                  ]

              for selector in selectors:
                  try:
                      inputs = page.locator(selector)

                      for i in range(inputs.count()):
                          x = inputs.nth(i)

                          if x.is_visible():
                              return x
                  except Exception:
                      pass

              raise RuntimeError(
                  f"Could not find visible {field.upper()} "
                  f"port input"
              )


          def select_port(page, port, field):
              close_cookie_popup(page)

              box = get_port_input(
                  page,
                  field
              )

              print(
                  f"Selecting {field.upper()}: {port}"
              )

              box.click(
                  force=True,
                  timeout=15000
              )

              box.fill("")

              box.type(
                  port,
                  delay=70
              )

              page.wait_for_timeout(2000)

              close_cookie_popup(page)

              # First choice: real autocomplete options.
              options = page.locator(
                  '[role="option"]:visible'
              )

              for i in range(options.count()):
                  try:
                      option = options.nth(i)
                      text = option.inner_text().strip()

                      print(
                          f"Option {i}: {text}"
                      )

                      if port.casefold() in text.casefold():
                          option.click(
                              force=True,
                              timeout=10000
                          )

                          page.wait_for_timeout(800)

                          print(
                              f"Selected: {text}"
                          )

                          return

                  except Exception:
                      pass

              # Second choice: list items.
              items = page.locator(
                  "li:visible"
              )

              for i in range(items.count()):
                  try:
                      item = items.nth(i)
                      text = item.inner_text().strip()

                      if (
                          port.casefold()
                          in text.casefold()
                      ):
                          item.click(
                              force=True,
                              timeout=10000
                          )

                          page.wait_for_timeout(800)

                          print(
                              f"Selected list item: {text}"
                          )

                          return

                  except Exception:
                      pass

              # Keyboard fallback.
              try:
                  box.press("ArrowDown")
                  box.press("Enter")

                  page.wait_for_timeout(800)

                  value = box.input_value()

                  if port.casefold() in value.casefold():
                      print(
                          f"Selected by keyboard: {port}"
                      )
                      return

              except Exception:
                  pass

              raise RuntimeError(
                  f"Could not select port: {port}"
              )


          def find_search_button(page):
              names = [
                  "Search",
                  "Show availability",
                  "Find availability",
                  "Check availability",
                  "Continue",
              ]

              for name in names:
                  buttons = page.get_by_role(
                      "button",
                      name=re.compile(
                          name,
                          re.I
                      )
                  )

                  for i in range(buttons.count()):
                      try:
                          button = buttons.nth(i)

                          if (
                              button.is_visible()
                              and button.is_enabled()
                          ):
                              return button

                      except Exception:
                          pass

              # Fallback to real submit buttons only.
              buttons = page.locator(
                  'button[type="submit"]:visible'
              )

              for i in range(buttons.count()):
                  try:
                      button = buttons.nth(i)

                      if button.is_enabled():
                          return button
                  except Exception:
                      pass

              return None


          def target_date_found(text):
              text = text.lower()

              patterns = [
                  "7 february 2027",
                  "07 february 2027",
                  "february 7, 2027",
                  "7 feb 2027",
                  "07 feb 2027",
                  "2027-02-07",
                  "07/02/2027",
                  "7/2/2027",
                  "07.02.2027",
              ]

              return any(
                  x in text
                  for x in patterns
              )


          def check_availability(text):
              lower = text.lower()

              negative = [
                  "sold out",
                  "fully booked",
                  "no availability",
                  "not available",
                  "unavailable",
                  "no departures",
                  "no results",
                  "nothing available",
              ]

              positive = [
                  "book now",
                  "available",
                  "availability",
                  "cabin",
                  "deck space",
                  "price",
                  "€",
                  "nok",
              ]

              if any(
                  x in lower
                  for x in negative
              ):
                  return False

              return any(
                  x in lower
                  for x in positive
              )


          def check_route(
              browser,
              origin,
              destination,
              route_id
          ):
              context = browser.new_context(
                  viewport={
                      "width": 1440,
                      "height": 1000
                  },
                  locale="en-US",
                  timezone_id="Europe/Oslo"
              )

              page = context.new_page()

              page.set_default_timeout(
                  30000
              )

              try:
                  print()
                  print("=" * 70)
                  print(
                      f"CHECKING: "
                      f"{origin} -> {destination}"
                  )
                  print("=" * 70)

                  page.goto(
                      URL,
                      wait_until="domcontentloaded",
                      timeout=60000
                  )

                  page.wait_for_timeout(6000)

                  # FIXED:
                  # Cookie overlay is handled first.
                  close_cookie_popup(page)

                  # FIXED:
                  # Explicitly select FROM and TO fields.
                  select_port(
                      page,
                      origin,
                      "from"
                  )

                  select_port(
                      page,
                      destination,
                      "to"
                  )

                  page.wait_for_timeout(
                      1000
                  )

                  close_cookie_popup(page)

                  button = find_search_button(
                      page
                  )

                  if button is None:
                      raise RuntimeError(
                          "Could not find "
                          "Search/Availability button"
                      )

                  print(
                      "Clicking search:"
                  )

                  button.click(
                      force=True,
                      timeout=15000
                  )

                  page.wait_for_timeout(
                      8000
                  )

                  try:
                      page.wait_for_load_state(
                          "domcontentloaded",
                          timeout=30000
                      )
                  except Exception:
                      pass

                  page.wait_for_timeout(
                      5000
                  )

                  text = page.locator(
                      "body"
                  ).inner_text(
                      timeout=30000
                  )

                  print(
                      "CURRENT URL:"
                  )
                  print(page.url)

                  print(
                      "PAGE TEXT:"
                  )
                  print(text[:30000])

                  page.screenshot(
                      path=f"{route_id}.png",
                      full_page=True
                  )

                  date_ok = target_date_found(
                      text
                  )

                  availability = (
                      date_ok
                      and check_availability(
                          text
                      )
                  )

                  print(
                      f"TARGET DATE: {date_ok}"
                  )

                  print(
                      f"AVAILABLE: {availability}"
                  )

                  return {
                      "available": availability,
                      "date": date_ok,
                      "url": page.url,
                  }

              except Exception as e:
                  print(
                      traceback.format_exc()
                  )

                  try:
                      page.screenshot(
                          path=f"{route_id}-ERROR.png",
                          full_page=True
                      )
                  except Exception:
                      pass

                  return {
                      "error": (
                          f"{type(e).__name__}: "
                          f"{e}"
                      ),
                      "available": False,
                      "date": False,
                  }

              finally:
                  context.close()


          def main():
              results = []
              errors = []
              found = []

              with sync_playwright() as p:
                  browser = p.chromium.launch(
                      headless=True
                  )

                  for origin, destination, route_id in ROUTES:

                      result = check_route(
                          browser,
                          origin,
                          destination,
                          route_id
                      )

                      results.append(
                          (
                              origin,
                              destination,
                              result
                          )
                      )

                      if result.get(
                          "error"
                      ):
                          errors.append(
                              (
                                  origin,
                                  destination,
                                  result["error"]
                              )
                          )

                      elif result.get(
                          "available"
                      ):
                          found.append(
                              (
                                  origin,
                                  destination
                              )
                          )

                  browser.close()

              # Only send availability email
              # when target date is actually found.
              if found:
                  lines = [
                      "Hurtigruten availability found!",
                      "",
                      f"Target date: {TARGET_DATE}",
                      "",
                  ]

                  for origin, destination in found:
                      lines.append(
                          f"{origin} -> {destination}"
                      )

                  lines.extend([
                      "",
                      "Booking:",
                      BOOKING_URL,
                  ])

                  send_mail(
                      "Hurtigruten availability FOUND",
                      "\n".join(lines)
                  )

              # Send ERROR only for actual program errors.
              if errors:
                  lines = [
                      "Hurtigruten monitor ERROR",
                      "",
                      f"Target date: {TARGET_DATE}",
                      "",
                  ]

                  for origin, destination, error in errors:
                      lines.extend([
                          f"{origin} -> {destination}",
                          f"Error: {error}",
                          "",
                      ])

                  send_mail(
                      "Hurtigruten monitor ERROR",
                      "\n".join(lines)
                  )

              print()
              print("=" * 70)
              print("FINAL RESULTS")
              print("=" * 70)

              for origin, destination, result in results:
                  print(
                      f"{origin} -> {destination}: "
                      f"date={result.get('date')} "
                      f"available={result.get('available')} "
                      f"error={result.get('error', '')}"
                  )


          if __name__ == "__main__":
              main()
          PY

      - name: Run monitor
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          python monitor.py

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hurtigruten-diagnostics
          path: |
            *.png
            monitor.py
          if-no-files-found: ignore

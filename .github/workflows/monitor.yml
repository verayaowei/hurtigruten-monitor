name: Hurtigruten Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Create monitor
        run: |
          cat > monitor.py <<'PY'
          from playwright.sync_api import sync_playwright
          from datetime import datetime

          URL = "https://www.hurtigruten.com/en/port-to-port"

          ROUTES = [
              ("Svolvær", "Skjervøy"),
              ("Svolvær", "Tromsø"),
              ("Bodø", "Tromsø"),
          ]

          DATE = "2027-02-07"

          def dump_page(page, name):
              print("\n" + "=" * 80)
              print(name)
              print("=" * 80)
              print("URL:", page.url)
              print("TITLE:", page.title())

              try:
                  text = page.locator("body").inner_text(timeout=30000)
                  print(text[:30000])
              except Exception as e:
                  print("Could not read page:", e)

              page.screenshot(
                  path=f"{name}.png",
                  full_page=True
              )

          def main():
              with sync_playwright() as p:

                  browser = p.chromium.launch(
                      headless=True
                  )

                  context = browser.new_context(
                      viewport={"width": 1440, "height": 1000},
                      locale="en-GB",
                      timezone_id="Europe/Oslo"
                  )

                  page = context.new_page()

                  print("Starting Hurtigruten monitor")
                  print("Time:", datetime.utcnow())

                  page.goto(
                      URL,
                      wait_until="domcontentloaded",
                      timeout=120000
                  )

                  page.wait_for_timeout(10000)

                  dump_page(page, "hurtigruten-main")

                  print("\n\nAvailable input fields:")

                  inputs = page.locator("input")

                  for i in range(inputs.count()):
                      try:
                          el = inputs.nth(i)

                          print(
                              i,
                              "placeholder=",
                              el.get_attribute("placeholder"),
                              "name=",
                              el.get_attribute("name"),
                              "type=",
                              el.get_attribute("type"),
                              "value=",
                              el.input_value()
                          )
                      except Exception:
                          pass

                  print("\n\nButtons:")

                  buttons = page.locator("button")

                  for i in range(buttons.count()):
                      try:
                          el = buttons.nth(i)

                          txt = el.inner_text().strip()

                          if txt:
                              print(i, repr(txt))
                      except Exception:
                          pass

                  browser.close()

          if __name__ == "__main__":
              main()
          PY

      - name: Run monitor
        run: python monitor.py

      - name: Save diagnostic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hurtigruten-diagnostics
          path: "*.png"
          if-no-files-found: ignore

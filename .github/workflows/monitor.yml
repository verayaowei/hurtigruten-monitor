name: Hurtigruten Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: .monitor-state
          key: hurtigruten-state-${{ github.run_id }}
          restore-keys: |
            hurtigruten-state-

      - name: Create monitor
        run: |
          cat > monitor.py <<'PY'
          import os
          import re
          import json
          import time
          import smtplib
          from datetime import datetime, timezone
          from email.mime.text import MIMEText
          from email.header import Header

          from playwright.sync_api import (
              sync_playwright,
              TimeoutError as PlaywrightTimeoutError
          )

          BOOKING_URL = "https://www.hurtigruten.com/en/port-to-port/booking"

          TARGET_DATE = "2027-02-07"

          ROUTES = [
              ("Svolvær", "Skjervøy"),
              ("Svolvær", "Tromsø"),
              ("Bodø", "Tromsø"),
          ]

          STATE_DIR = ".monitor-state"
          STATE_FILE = os.path.join(STATE_DIR, "state.json")


          def log(msg):
              print(
                  f"[{datetime.now(timezone.utc).isoformat()}] {msg}",
                  flush=True
              )


          def clean(text):
              return re.sub(r"\s+", " ", text or "").strip()


          def screenshot(page, name):
              try:
                  page.screenshot(
                      path=f"{name}.png",
                      full_page=True,
                      timeout=60000
                  )
              except Exception as e:
                  log(f"Screenshot error: {e}")


          def load_state():
              os.makedirs(STATE_DIR, exist_ok=True)

              if not os.path.exists(STATE_FILE):
                  return {}

              try:
                  with open(
                      STATE_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:
                      return json.load(f)
              except Exception:
                  return {}


          def save_state(state):
              os.makedirs(STATE_DIR, exist_ok=True)

              with open(
                  STATE_FILE,
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      state,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )


          def visible(locator):
              try:
                  return locator.is_visible(timeout=5000)
              except Exception:
                  return False


          def select_port(page, port, placeholder):
              log(f"Selecting {port}")

              field = page.get_by_placeholder(
                  placeholder,
                  exact=True
              ).first

              field.wait_for(
                  state="visible",
                  timeout=45000
              )

              field.click(timeout=15000)

              # Clear existing value.
              try:
                  field.press("Control+A")
                  field.press("Backspace")
              except Exception:
                  pass

              field.fill(
                  port,
                  timeout=15000
              )

              page.wait_for_timeout(2500)

              # Try exact visible option.
              exact = page.get_by_text(
                  port,
                  exact=True
              )

              for i in range(exact.count() - 1, -1, -1):
                  item = exact.nth(i)

                  if not visible(item):
                      continue

                  try:
                      item.click(timeout=15000)
                      page.wait_for_timeout(1200)
                      log(f"Selected {port}")
                      return True
                  except Exception:
                      pass

              # Try role=option.
              options = page.locator('[role="option"]')

              for i in range(options.count()):
                  item = options.nth(i)

                  if not visible(item):
                      continue

                  try:
                      text = clean(item.inner_text())

                      if port.lower() in text.lower():
                          item.click(timeout=15000)
                          page.wait_for_timeout(1200)
                          log(f"Selected option {text}")
                          return True
                  except Exception:
                      pass

              # Keyboard fallback.
              try:
                  field.press("ArrowDown")
                  field.press("Enter")
                  page.wait_for_timeout(1500)

                  value = field.input_value()

                  if port.lower() in value.lower():
                      log(f"Selected {port} by keyboard")
                      return True
              except Exception:
                  pass

              return False


          def submit_route(page):
              """
              The booking page is a dynamic application.
              Instead of guessing a button label, submit the
              completed route form with Enter.
              """

              log("Submitting route form")

              # Try the To field first.
              try:
                  field = page.get_by_placeholder(
                      "Sail to where?",
                      exact=True
                  ).first

                  field.press("Enter")
                  page.wait_for_timeout(7000)

                  if page.url != BOOKING_URL:
                      log(f"Booking navigation: {page.url}")
                      return True
              except Exception as e:
                  log(f"To-field submit failed: {e}")

              # Try Enter on the page.
              try:
                  page.keyboard.press("Enter")
                  page.wait_for_timeout(7000)

                  if page.url != BOOKING_URL:
                      log(f"Page navigation: {page.url}")
                      return True
              except Exception as e:
                  log(f"Page submit failed: {e}")

              # Last fallback: submit an actual form.
              try:
                  forms = page.locator("form")

                  for i in range(forms.count()):
                      form = forms.nth(i)

                      if not visible(form):
                          continue

                      try:
                          form.evaluate(
                              "(form) => form.requestSubmit()"
                          )

                          page.wait_for_timeout(7000)

                          if page.url != BOOKING_URL:
                              return True

                      except Exception:
                          pass

              except Exception:
                  pass

              return True


          def date_present(text):
              text = clean(text).lower()

              patterns = [
                  r"\b2027[-/.]02[-/.]07\b",
                  r"\b07[-/.]02[-/.]2027\b",
                  r"\b7[-/.]2[-/.]2027\b",
                  r"\b07\s+february\s+2027\b",
                  r"\b7\s+february\s+2027\b",
                  r"\bfebruary\s+7,?\s+2027\b",
                  r"\b07\s+feb\s+2027\b",
                  r"\b7\s+feb\s+2027\b",
                  r"\bfeb\s+7,?\s+2027\b",
              ]

              return any(
                  re.search(p, text)
                  for p in patterns
              )


          def availability_signals(text):
              text = clean(text).lower()

              negative = [
                  "no availability",
                  "no sailings",
                  "no voyages",
                  "no results",
                  "not available",
                  "unavailable",
                  "sold out",
                  "fully booked"
              ]

              positive = [
                  "book",
                  "select",
                  "available",
                  "price",
                  "from €",
                  "from nok",
                  "eur",
                  "nok",
                  "gbp",
                  "usd"
              ]

              negatives = [
                  x for x in negative
                  if x in text
              ]

              positives = [
                  x for x in positive
                  if x in text
              ]

              # Require the target date AND at least one
              # meaningful booking/price signal.
              return (
                  date_present(text)
                  and len(positives) > 0
                  and len(negatives) == 0
              ), positives, negatives


          def inspect(page, route):
              try:
                  text = page.locator(
                      "body"
                  ).inner_text(timeout=60000)
              except Exception:
                  text = ""

              text = clean(text)

              screenshot(
                  page,
                  "result_" +
                  re.sub(
                      r"[^A-Za-z0-9]+",
                      "_",
                      route[0] + "_" + route[1]
                  )
              )

              available, positives, negatives = \
                  availability_signals(text)

              log(f"URL: {page.url}")
              log(f"Target date found: {date_present(text)}")
              log(f"Positive signals: {positives}")
              log(f"Negative signals: {negatives}")
              log(f"Availability candidate: {available}")

              # Save a useful diagnostic text file.
              filename = (
                  "result_" +
                  re.sub(
                      r"[^A-Za-z0-9]+",
                      "_",
                      route[0] + "_" + route[1]
                  ) +
                  ".txt"
              )

              with open(
                  filename,
                  "w",
                  encoding="utf-8"
              ) as f:
                  f.write(text[:50000])

              return {
                  "route": route,
                  "available": available,
                  "date_found": date_present(text),
                  "positive_signals": positives,
                  "negative_signals": negatives,
                  "url": page.url,
                  "text": text[:12000]
              }


          def check_route(browser, route):
              context = browser.new_context(
                  viewport={
                      "width": 1440,
                      "height": 1100
                  },
                  locale="en-GB",
                  timezone_id="Europe/Oslo"
              )

              page = context.new_page()

              page.set_default_timeout(60000)
              page.set_default_navigation_timeout(120000)

              try:
                  log("")
                  log("=" * 70)
                  log(
                      f"CHECKING "
                      f"{route[0]} -> {route[1]}"
                  )
                  log("=" * 70)

                  page.goto(
                      BOOKING_URL,
                      wait_until="domcontentloaded",
                      timeout=120000
                  )

                  page.wait_for_timeout(8000)

                  screenshot(
                      page,
                      "before_" +
                      re.sub(
                          r"[^A-Za-z0-9]+",
                          "_",
                          route[0] + "_" + route[1]
                      )
                  )

                  # From.
                  if not select_port(
                      page,
                      route[0],
                      "Sail from where?"
                  ):
                      raise RuntimeError(
                          f"Could not select FROM {route[0]}"
                      )

                  # To.
                  if not select_port(
                      page,
                      route[1],
                      "Sail to where?"
                  ):
                      raise RuntimeError(
                          f"Could not select TO {route[1]}"
                      )

                  page.wait_for_timeout(1500)

                  # Submit without depending on a specific
                  # button name.
                  submit_route(page)

                  # Give the booking application time to render.
                  page.wait_for_timeout(12000)

                  try:
                      page.wait_for_load_state(
                          "domcontentloaded",
                          timeout=30000
                      )
                  except Exception:
                      pass

                  page.wait_for_timeout(5000)

                  return inspect(page, route)

              except Exception as e:
                  log(
                      f"ERROR {route[0]} -> {route[1]}: "
                      f"{type(e).__name__}: {e}"
                  )

                  screenshot(
                      page,
                      "ERROR_" +
                      re.sub(
                          r"[^A-Za-z0-9]+",
                          "_",
                          route[0] + "_" + route[1]
                      )
                  )

                  return {
                      "route": route,
                      "failed": True,
                      "error":
                          f"{type(e).__name__}: {e}",
                      "url": page.url
                  }

              finally:
                  context.close()


          def send_email(subject, body):
              user = os.environ["SMTP_USER"]
              password = os.environ["SMTP_PASSWORD"]
              recipient = os.environ["ALERT_EMAIL"]

              message = MIMEText(
                  body,
                  "plain",
                  "utf-8"
              )

              message["Subject"] = Header(
                  subject,
                  "utf-8"
              )

              message["From"] = user
              message["To"] = recipient

              with smtplib.SMTP_SSL(
                  "smtp.qq.com",
                  465,
                  timeout=30
              ) as smtp:
                  smtp.login(
                      user,
                      password
                  )

                  smtp.sendmail(
                      user,
                      [recipient],
                      message.as_string()
                  )


          def main():
              log("Hurtigruten monitor started.")

              previous = load_state()

              results = []

              with sync_playwright() as p:
                  browser = p.chromium.launch(
                      headless=True
                  )

                  try:
                      for route in ROUTES:
                          result = check_route(
                              browser,
                              route
                          )

                          results.append(result)

                          time.sleep(3)

                  finally:
                      browser.close()

              alerts = []
              failures = []

              for result in results:
                  route = result["route"]

                  key = (
                      route[0]
                      + "->"
                      + route[1]
                      + "@"
                      + TARGET_DATE
                  )

                  if result.get("failed"):
                      failures.append(result)
                      continue

                  available = result.get(
                      "available",
                      False
                  )

                  was_available = previous.get(
                      key,
                      False
                  )

                  # New availability only.
                  if available and not was_available:
                      alerts.append(result)

                  # Remember current state.
                  previous[key] = available

              save_state(previous)

              # Availability alert.
              if alerts:
                  lines = [
                      "Hurtigruten 航次提醒",
                      "",
                      f"目标日期：{TARGET_DATE}",
                      ""
                  ]

                  for result in alerts:
                      route = result["route"]

                      lines.extend([
                          f"路线："
                          f"{route[0]} → {route[1]}",
                          f"页面："
                          f"{result.get('url', '')}",
                          "",
                          "检测到目标日期的可预订信号。",
                          "请立即打开页面确认并完成预订。",
                          ""
                      ])

                  send_email(
                      "Hurtigruten 航次提醒",
                      "\n".join(lines)
                  )

                  log(
                      f"Availability email sent: "
                      f"{len(alerts)}"
                  )

              # Failure alert.
              if failures:
                  lines = [
                      "Hurtigruten 监控异常",
                      "",
                      f"目标日期：{TARGET_DATE}",
                      ""
                  ]

                  for result in failures:
                      route = result["route"]

                      lines.extend([
                          f"路线："
                          f"{route[0]} → {route[1]}",
                          f"Error："
                          f"{result.get('error', 'unknown')}",
                          f"URL："
                          f"{result.get('url', '')}",
                          ""
                      ])

                  send_email(
                      "⚠️ Hurtigruten 监控异常",
                      "\n".join(lines)
                  )

                  log(
                      f"Failure email sent: "
                      f"{len(failures)}"
                  )

              log("Monitor finished.")


          if __name__ == "__main__":
              main()
          PY

      - name: Run monitor
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          python monitor.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .monitor-state
          key: hurtigruten-state-${{ github.run_id }}

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hurtigruten-diagnostics
          path: |
            *.png
            *.txt
            .monitor-state/state.json
          if-no-files-found: ignore

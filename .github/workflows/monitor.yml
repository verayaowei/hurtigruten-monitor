name: Hurtigruten Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Restore monitor state
        uses: actions/cache/restore@v4
        with:
          path: .monitor-state
          key: hurtigruten-monitor-state-${{ github.run_id }}
          restore-keys: |
            hurtigruten-monitor-state-

      - name: Create monitor
        run: |
          cat > monitor.py <<'PY'
          import os
          import re
          import json
          import time
          from datetime import datetime, timezone

          from playwright.sync_api import sync_playwright, TimeoutError as PlaywrightTimeoutError


          URL = "https://www.hurtigruten.com/en/port-to-port"

          ROUTES = [
              ("Svolvær", "Skjervøy"),
              ("Svolvær", "Tromsø"),
              ("Bodø", "Tromsø"),
          ]

          TARGET_DATE = "2027-02-07"

          STATE_DIR = ".monitor-state"
          STATE_FILE = os.path.join(STATE_DIR, "state.json")


          def log(message):
              now = datetime.now(timezone.utc).isoformat()
              print(f"[{now}] {message}", flush=True)


          def safe_name(text):
              return re.sub(r"[^A-Za-z0-9_-]+", "_", text)


          def screenshot(page, name):
              try:
                  page.screenshot(
                      path=f"{safe_name(name)}.png",
                      full_page=True,
                      timeout=60000
                  )
              except Exception as e:
                  log(f"Screenshot failed: {e}")


          def get_body(page):
              try:
                  return page.locator("body").inner_text(
                      timeout=60000
                  )
              except Exception as e:
                  log(f"Body read failed: {e}")
                  return ""


          def visible(locator):
              try:
                  return locator.is_visible(timeout=5000)
              except Exception:
                  return False


          def click_port_option(page, port):
              log(f"Looking for port option: {port}")

              # First: exact visible text.
              try:
                  exact = page.get_by_text(
                      port,
                      exact=True
                  )

                  count = exact.count()

                  for i in range(count - 1, -1, -1):
                      try:
                          item = exact.nth(i)

                          if visible(item):
                              item.click(
                                  timeout=15000
                              )

                              page.wait_for_timeout(1000)

                              log(
                                  f"Selected port: {port}"
                              )

                              return True

                      except Exception:
                          pass
              except Exception:
                  pass

              # Second: role option.
              try:
                  options = page.locator(
                      '[role="option"]'
                  )

                  for i in range(options.count()):
                      try:
                          item = options.nth(i)

                          if not visible(item):
                              continue

                          text = item.inner_text().strip()

                          if port.lower() in text.lower():
                              item.click(
                                  timeout=15000
                              )

                              page.wait_for_timeout(1000)

                              log(
                                  f"Selected option: {text}"
                              )

                              return True

                      except Exception:
                          pass
              except Exception:
                  pass

              # Third: common autocomplete elements.
              selectors = [
                  "li",
                  '[class*="option"]',
                  '[class*="autocomplete"]',
                  '[class*="suggestion"]',
                  '[class*="dropdown"]'
              ]

              for selector in selectors:
                  try:
                      items = page.locator(selector)

                      for i in range(items.count()):
                          try:
                              item = items.nth(i)

                              if not visible(item):
                                  continue

                              text = item.inner_text().strip()

                              if (
                                  text
                                  and port.lower() in text.lower()
                              ):
                                  item.click(
                                      timeout=15000
                                  )

                                  page.wait_for_timeout(1000)

                                  log(
                                      f"Selected fallback option: "
                                      f"{text}"
                                  )

                                  return True

                          except Exception:
                              pass

                  except Exception:
                      pass

              return False


          def select_port(page, port, kind):
              log(
                  f"Selecting {kind}: {port}"
              )

              # Current official page exposes these placeholders.
              placeholder = (
                  "Sail from where?"
                  if kind == "FROM"
                  else
                  "Sail to where?"
              )

              # Retry the entire operation.
              for attempt in range(1, 4):
                  log(
                      f"{kind} attempt {attempt}/3"
                  )

                  try:
                      field = page.get_by_placeholder(
                          placeholder,
                          exact=True
                      ).first

                      field.wait_for(
                          state="visible",
                          timeout=30000
                      )

                      field.click(
                          timeout=15000
                      )

                      field.fill(
                          port,
                          timeout=15000
                      )

                      page.wait_for_timeout(2500)

                      if click_port_option(
                          page,
                          port
                      ):
                          return True

                  except PlaywrightTimeoutError as e:
                      log(
                          f"{kind} timeout on "
                          f"attempt {attempt}: {e}"
                      )

                  except Exception as e:
                      log(
                          f"{kind} error on "
                          f"attempt {attempt}: "
                          f"{type(e).__name__}: {e}"
                      )

                  page.wait_for_timeout(3000)

              return False


          def set_date(page):
              log(
                  f"Looking for date control: "
                  f"{TARGET_DATE}"
              )

              # Native date control.
              try:
                  fields = page.locator(
                      'input[type="date"]'
                  )

                  for i in range(fields.count()):
                      try:
                          field = fields.nth(i)

                          if not visible(field):
                              continue

                          field.fill(
                              TARGET_DATE,
                              timeout=15000
                          )

                          log(
                              "Target date entered."
                          )

                          return True

                      except Exception:
                          pass
              except Exception:
                  pass

              # Date-related input.
              try:
                  fields = page.locator("input")

                  for i in range(fields.count()):
                      try:
                          field = fields.nth(i)

                          if not visible(field):
                              continue

                          info = " ".join([
                              field.get_attribute(
                                  "placeholder"
                              ) or "",
                              field.get_attribute(
                                  "aria-label"
                              ) or "",
                              field.get_attribute(
                                  "name"
                              ) or "",
                              field.get_attribute(
                                  "id"
                              ) or ""
                          ]).lower()

                          if not any(
                              word in info
                              for word in [
                                  "date",
                                  "departure",
                                  "travel"
                              ]
                          ):
                              continue

                          field.click(
                              timeout=10000
                          )

                          try:
                              field.fill(
                                  TARGET_DATE,
                                  timeout=10000
                              )
                          except Exception:
                              field.press(
                                  "Control+A"
                              )
                              field.type(
                                  TARGET_DATE
                              )

                          log(
                              "Target date entered "
                              "into date-related field."
                          )

                          return True

                      except Exception:
                          pass
              except Exception:
                  pass

              log(
                  "No editable date control found."
              )

              return False


          def click_search(page):
              patterns = [
                  "Search",
                  "Show availability",
                  "Find availability",
                  "Check availability",
                  "Continue",
                  "See availability",
                  "View availability"
              ]

              for pattern in patterns:
                  try:
                      buttons = page.get_by_role(
                          "button",
                          name=re.compile(
                              pattern,
                              re.I
                          )
                      )

                      for i in range(buttons.count()):
                          try:
                              button = buttons.nth(i)

                              if not visible(button):
                                  continue

                              if not button.is_enabled():
                                  continue

                              log(
                                  "Clicking: "
                                  + button.inner_text().strip()
                              )

                              button.click(
                                  timeout=15000
                              )

                              return True

                          except Exception:
                              pass

                  except Exception:
                      pass

              # Generic button fallback.
              try:
                  buttons = page.locator("button")

                  for i in range(buttons.count()):
                      try:
                          button = buttons.nth(i)

                          if not visible(button):
                              continue

                          if not button.is_enabled():
                              continue

                          text = button.inner_text().strip()

                          if re.search(
                              r"search|availability|continue|"
                              r"find|show|view",
                              text,
                              re.I
                          ):
                              log(
                                  "Clicking fallback: "
                                  + text
                              )

                              button.click(
                                  timeout=15000
                              )

                              return True

                      except Exception:
                          pass
              except Exception:
                  pass

              return False


          def date_visible(text):
              text = re.sub(
                  r"\s+",
                  " ",
                  text.lower()
              )

              patterns = [
                  r"\b2027[-/.]02[-/.]07\b",
                  r"\b07[-/.]02[-/.]2027\b",
                  r"\b7[-/.]2[-/.]2027\b",
                  r"\b07\s+feb(?:ruary)?\s+2027\b",
                  r"\b7\s+feb(?:ruary)?\s+2027\b",
                  r"\bfeb(?:ruary)?\s+7,?\s+2027\b"
              ]

              return any(
                  re.search(
                      pattern,
                      text
                  )
                  for pattern in patterns
              )


          def inspect(page, route):
              text = get_body(page)

              screenshot(
                  page,
                  f"result_{route[0]}_{route[1]}"
              )

              log(
                  f"Result URL: {page.url}"
              )

              log(
                  f"Result title: {page.title()}"
              )

              exact_date = date_visible(text)

              lower = text.lower()

              negatives = [
                  x
                  for x in [
                      "no availability",
                      "no voyages",
                      "no sailings",
                      "not available",
                      "sold out",
                      "no results",
                      "nothing found",
                      "unavailable"
                  ]
                  if x in lower
              ]

              price = bool(
                  re.search(
                      r"(€|EUR|NOK|£|GBP|\$|USD)\s?\d",
                      text,
                      re.I
                  )
                  or
                  re.search(
                      r"\d[\d,.]*\s?(EUR|NOK|GBP|USD)",
                      text,
                      re.I
                  )
              )

              book_signal = (
                  "book now" in lower
                  or "available" in lower
                  or "select" in lower
                  or price
              )

              potential = (
                  exact_date
                  and not negatives
                  and book_signal
              )

              log(
                  f"Target date visible: {exact_date}"
              )

              log(
                  f"Price found: {price}"
              )

              log(
                  f"Negative signals: {negatives}"
              )

              log(
                  f"Availability candidate: {potential}"
              )

              print(text[:50000])

              return {
                  "route": route,
                  "potential": potential,
                  "date_visible": exact_date,
                  "price_found": price,
                  "negative_signals": negatives,
                  "url": page.url,
                  "text": text[:12000]
              }


          def check_route(browser, route):
              context = browser.new_context(
                  viewport={
                      "width": 1440,
                      "height": 1100
                  },
                  locale="en-GB",
                  timezone_id="Europe/Oslo"
              )

              page = context.new_page()

              # Longer Playwright defaults.
              page.set_default_timeout(
                  60000
              )

              page.set_default_navigation_timeout(
                  120000
              )

              try:
                  log("")
                  log("=" * 80)
                  log(
                      f"CHECKING "
                      f"{route[0]} -> {route[1]}"
                  )
                  log("=" * 80)

                  page.goto(
                      URL,
                      wait_until="domcontentloaded",
                      timeout=120000
                  )

                  page.wait_for_timeout(
                      12000
                  )

                  screenshot(
                      page,
                      f"before_{route[0]}_{route[1]}"
                  )

                  # Retry navigation once if the page is incomplete.
                  if (
                      page.get_by_placeholder(
                          "Sail from where?",
                          exact=True
                      ).count() == 0
                  ):
                      log(
                          "Port fields not detected; "
                          "reloading page."
                      )

                      page.reload(
                          wait_until="domcontentloaded",
                          timeout=120000
                      )

                      page.wait_for_timeout(
                          10000
                      )

                  if not select_port(
                      page,
                      route[0],
                      "FROM"
                  ):
                      raise RuntimeError(
                          f"Could not select FROM "
                          f"{route[0]}"
                      )

                  if not select_port(
                      page,
                      route[1],
                      "TO"
                  ):
                      raise RuntimeError(
                          f"Could not select TO "
                          f"{route[1]}"
                      )

                  page.wait_for_timeout(
                      2000
                  )

                  set_date(page)

                  page.wait_for_timeout(
                      2000
                  )

                  if not click_search(page):
                      raise RuntimeError(
                          "Could not find search/"
                          "availability button"
                      )

                  # Allow dynamic booking page to load.
                  page.wait_for_timeout(
                      10000
                  )

                  try:
                      page.wait_for_load_state(
                          "domcontentloaded",
                          timeout=60000
                      )
                  except Exception:
                      pass

                  page.wait_for_timeout(
                      8000
                  )

                  return inspect(
                      page,
                      route
                  )

              except Exception as e:
                  log(
                      f"ROUTE ERROR "
                      f"{route[0]} -> {route[1]}: "
                      f"{type(e).__name__}: {e}"
                  )

                  screenshot(
                      page,
                      f"ERROR_{route[0]}_{route[1]}"
                  )

                  return {
                      "route": route,
                      "potential": False,
                      "failed": True,
                      "error": (
                          f"{type(e).__name__}: {e}"
                      ),
                      "url": page.url
                  }

              finally:
                  context.close()


          def load_state():
              os.makedirs(
                  STATE_DIR,
                  exist_ok=True
              )

              if not os.path.exists(
                  STATE_FILE
              ):
                  return {}

              try:
                  with open(
                      STATE_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:
                      return json.load(f)
              except Exception:
                  return {}


          def save_state(state):
              os.makedirs(
                  STATE_DIR,
                  exist_ok=True
              )

              with open(
                  STATE_FILE,
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      state,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )


          def main():
              log(
                  "Hurtigruten monitor started."
              )

              previous = load_state()

              results = []

              with sync_playwright() as p:
                  browser = p.chromium.launch(
                      headless=True
                  )

                  try:
                      for route in ROUTES:
                          result = check_route(
                              browser,
                              route
                          )

                          results.append(
                              result
                          )

                          # Small pause between routes.
                          time.sleep(3)

                  finally:
                      browser.close()

              found = [
                  x
                  for x in results
                  if x.get("potential")
              ]

              failures = [
                  x
                  for x in results
                  if x.get("failed")
              ]

              new_found = []

              for result in found:
                  route = result["route"]

                  key = (
                      f"{route[0]}->{route[1]}"
                      f"@{TARGET_DATE}"
                  )

                  if not previous.get(
                      key,
                      False
                  ):
                      new_found.append(
                          result
                      )

                  previous[key] = True

              # Reset notification after availability disappears.
              for result in results:
                  if result.get("failed"):
                      continue

                  route = result["route"]

                  key = (
                      f"{route[0]}->{route[1]}"
                      f"@{TARGET_DATE}"
                  )

                  if not result.get(
                      "potential"
                  ):
                      previous[key] = False

              save_state(previous)

              if new_found:
                  lines = [
                      "Hurtigruten 航次提醒",
                      "",
                      f"目标日期：{TARGET_DATE}",
                      ""
                  ]

                  for result in new_found:
                      route = result["route"]

                      lines.extend([
                          f"路线："
                          f"{route[0]} → {route[1]}",
                          f"页面："
                          f"{result.get('url', '')}",
                          "检测到目标日期及可预订信号。",
                          ""
                      ])

                  with open(
                      "availability_found.txt",
                      "w",
                      encoding="utf-8"
                  ) as f:
                      f.write(
                          "\n".join(lines)
                      )

                  log(
                      f"NEW AVAILABILITY: "
                      f"{len(new_found)} route(s)"
                  )

              if failures:
                  lines = [
                      "Hurtigruten monitor failure",
                      "",
                      f"Target date: {TARGET_DATE}",
                      ""
                  ]

                  for result in failures:
                      route = result["route"]

                      lines.extend([
                          f"Route: "
                          f"{route[0]} -> {route[1]}",
                          f"Error: "
                          f"{result.get('error', 'unknown')}",
                          f"URL: "
                          f"{result.get('url', '')}",
                          ""
                      ])

                  with open(
                      "monitor_failed.txt",
                      "w",
                      encoding="utf-8"
                  ) as f:
                      f.write(
                          "\n".join(lines)
                      )

                  log(
                      f"{len(failures)} route(s) "
                      f"had errors."
                  )

              log(
                  "Hurtigruten monitor finished."
              )


          if __name__ == "__main__":
              main()
          PY

      - name: Run Monitor
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          python monitor.py

      - name: Send availability alert
        if: hashFiles('availability_found.txt') != ''
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          from email.mime.text import MIMEText
          from email.header import Header

          user = os.environ["SMTP_USER"]
          password = os.environ["SMTP_PASSWORD"]
          recipient = os.environ["ALERT_EMAIL"]

          with open(
              "availability_found.txt",
              "r",
              encoding="utf-8"
          ) as f:
              body = f.read()

          message = MIMEText(
              body,
              "plain",
              "utf-8"
          )

          message["Subject"] = Header(
              "Hurtigruten 航次提醒",
              "utf-8"
          )

          message["From"] = user
          message["To"] = recipient

          with smtplib.SMTP_SSL(
              "smtp.qq.com",
              465,
              timeout=30
          ) as smtp:
              smtp.login(
                  user,
                  password
              )
              smtp.sendmail(
                  user,
                  [recipient],
                  message.as_string()
              )

          print("Availability email sent.")
          PY

      - name: Send monitor failure alert
        if: hashFiles('monitor_failed.txt') != ''
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          from email.mime.text import MIMEText
          from email.header import Header

          user = os.environ["SMTP_USER"]
          password = os.environ["SMTP_PASSWORD"]
          recipient = os.environ["ALERT_EMAIL"]

          with open(
              "monitor_failed.txt",
              "r",
              encoding="utf-8"
          ) as f:
              body = f.read()

          message = MIMEText(
              body,
              "plain",
              "utf-8"
          )

          message["Subject"] = Header(
              "⚠️ Hurtigruten 监控异常",
              "utf-8"
          )

          message["From"] = user
          message["To"] = recipient

          with smtplib.SMTP_SSL(
              "smtp.qq.com",
              465,
              timeout=30
          ) as smtp:
              smtp.login(
                  user,
                  password
              )
              smtp.sendmail(
                  user,
                  [recipient],
                  message.as_string()
              )

          print("Failure email sent.")
          PY

      - name: Save monitor state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .monitor-state
          key: hurtigruten-monitor-state-${{ github.run_id }}

      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hurtigruten-diagnostics
          path: |
            *.png
            availability_found.txt
            monitor_failed.txt
            .monitor-state/state.json
          if-no-files-found: ignore

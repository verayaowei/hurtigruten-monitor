name: Hurtigruten Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Create diagnostic monitor
        run: |
          cat > monitor.py <<'PY'
          import json
          import os
          import re
          import time
          from pathlib import Path

          from playwright.sync_api import sync_playwright


          URL = "https://www.hurtigruten.com/en/port-to-port"

          TARGET_DATE = "2027-02-07"

          ROUTES = [
              ("Svolvær", "Skjervøy"),
              ("Svolvær", "Tromsø"),
              ("Bodø", "Tromsø"),
          ]


          def visible(locator):
              try:
                  return locator.is_visible()
              except Exception:
                  return False


          def remove_cookie_overlay(page):
              selectors = [
                  "#onetrust-accept-btn-handler",
                  "#onetrust-reject-all-handler",
                  "button:has-text('Accept all')",
                  "button:has-text('Reject all')",
              ]

              for selector in selectors:
                  try:
                      loc = page.locator(selector)

                      for i in range(loc.count()):
                          item = loc.nth(i)

                          if visible(item):
                              item.click(
                                  force=True,
                                  timeout=3000
                              )
                              time.sleep(1)
                              return
                  except Exception:
                      pass

              try:
                  page.locator(
                      ".onetrust-pc-dark-filter"
                  ).evaluate_all(
                      "(els) => els.forEach(e => e.remove())"
                  )
              except Exception:
                  pass


          def all_frames(page):
              return [page] + [
                  frame for frame in page.frames
                  if frame != page
              ]


          def find_port_input(page, port_type):
              if port_type == "from":
                  selectors = [
                      'input[placeholder*="Sail from" i]',
                      'input[aria-label*="Sail from" i]',
                  ]
              else:
                  selectors = [
                      'input[placeholder*="Sail to" i]',
                      'input[aria-label*="Sail to" i]',
                  ]

              for frame in all_frames(page):
                  for selector in selectors:
                      try:
                          loc = frame.locator(selector)

                          for i in range(loc.count()):
                              item = loc.nth(i)

                              if visible(item):
                                  return frame, item
                      except Exception:
                          pass

              return None, None


          def select_port(page, port, port_type):
              frame, inp = find_port_input(
                  page,
                  port_type
              )

              if inp is None:
                  raise RuntimeError(
                      f"Cannot find {port_type} port input"
                  )

              print(
                  f"SELECTING {port_type.upper()}: {port}"
              )

              inp.click(force=True)
              inp.fill("")
              inp.type(
                  port,
                  delay=80
              )

              time.sleep(2)

              selectors = [
                  '[role="option"]:visible',
                  'li:visible',
              ]

              for selector in selectors:
                  try:
                      options = frame.locator(selector)

                      for i in range(options.count()):
                          option = options.nth(i)

                          if not visible(option):
                              continue

                          try:
                              text = option.inner_text().strip()
                          except Exception:
                              continue

                          if port.lower() in text.lower():
                              print(
                                  "CLICKING OPTION:",
                                  text
                              )

                              option.click(
                                  force=True
                              )

                              time.sleep(2)

                              return
                  except Exception:
                      pass

              try:
                  inp.press("ArrowDown")
                  inp.press("Enter")
                  time.sleep(2)
                  return
              except Exception:
                  pass

              raise RuntimeError(
                  f"Could not select port: {port}"
              )


          def dump_dom(page):
              print("\n========== DOM DUMP ==========\n")

              for frame_number, frame in enumerate(
                  all_frames(page)
              ):
                  print(
                      f"\n===== FRAME {frame_number} =====\n"
                  )

                  try:
                      html = frame.locator(
                          "body"
                      ).inner_text(
                          timeout=5000
                      )

                      print(
                          html[:30000]
                      )
                  except Exception as e:
                      print(
                          "BODY ERROR:",
                          repr(e)
                      )

                  try:
                      forms = frame.locator("form")

                      print(
                          "\nFORMS:",
                          forms.count()
                      )

                      for i in range(
                          min(forms.count(), 10)
                      ):
                          try:
                              html = forms.nth(i).evaluate(
                                  "(e) => e.outerHTML"
                              )

                              print(
                                  f"\nFORM {i}:\n"
                              )

                              print(
                                  html[:20000]
                              )
                          except Exception:
                              pass
                  except Exception:
                      pass

                  try:
                      inputs = frame.locator(
                          "input"
                      )

                      print(
                          "\nINPUTS:",
                          inputs.count()
                      )

                      for i in range(
                          min(inputs.count(), 100)
                      ):
                          try:
                              html = inputs.nth(i).evaluate(
                                  "(e) => e.outerHTML"
                              )

                              print(
                                  f"\nINPUT {i}:\n"
                              )

                              print(
                                  html[:5000]
                              )
                          except Exception:
                              pass

                  except Exception:
                      pass

                  try:
                      buttons = frame.locator(
                          "button"
                      )

                      print(
                          "\nBUTTONS:",
                          buttons.count()
                      )

                      for i in range(
                          min(buttons.count(), 100)
                      ):
                          try:
                              html = buttons.nth(i).evaluate(
                                  "(e) => e.outerHTML"
                              )

                              print(
                                  f"\nBUTTON {i}:\n"
                              )

                              print(
                                  html[:5000]
                              )
                          except Exception:
                              pass

                  except Exception:
                      pass


          def install_network_logging(page):
              requests = []
              responses = []

              def on_request(request):
                  try:
                      resource_type = request.resource_type

                      if resource_type in [
                          "xhr",
                          "fetch",
                      ]:
                          item = {
                              "type": "request",
                              "method": request.method,
                              "url": request.url,
                              "post_data": request.post_data,
                          }

                          requests.append(item)

                          print(
                              "\n>>> REQUEST"
                          )

                          print(
                              json.dumps(
                                  item,
                                  ensure_ascii=False,
                                  indent=2
                              )
                          )

                  except Exception:
                      pass


              def on_response(response):
                  try:
                      request = response.request

                      if request.resource_type not in [
                          "xhr",
                          "fetch",
                      ]:
                          return

                      item = {
                          "type": "response",
                          "status": response.status,
                          "url": response.url,
                      }

                      responses.append(item)

                      print(
                          "\n<<< RESPONSE"
                      )

                      print(
                          json.dumps(
                              item,
                              ensure_ascii=False,
                              indent=2
                          )
                      )

                      try:
                          text = response.text()

                          if text:
                              safe_name = re.sub(
                                  r"[^A-Za-z0-9_.-]+",
                                  "_",
                                  response.url
                              )[:150]

                              Path(
                                  "responses"
                              ).mkdir(
                                  exist_ok=True
                              )

                              with open(
                                  "responses/"
                                  + safe_name
                                  + ".txt",
                                  "w",
                                  encoding="utf-8"
                              ) as f:
                                  f.write(text[:500000])
                      except Exception:
                          pass

                  except Exception:
                      pass


              page.on(
                  "request",
                  on_request
              )

              page.on(
                  "response",
                  on_response
              )

              return requests, responses


          def dump_requests(
              requests,
              responses
          ):
              data = {
                  "requests": requests,
                  "responses": responses,
              }

              with open(
                  "network.json",
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      data,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )


          def try_cabin_button(page):
              names = [
                  "I do not want to book a cabin",
                  "I want to book a cabin",
              ]

              for name in names:
                  for frame in all_frames(page):
                      try:
                          buttons = frame.get_by_role(
                              "button",
                              name=re.compile(
                                  re.escape(name),
                                  re.I
                              )
                          )

                          for i in range(
                              buttons.count()
                          ):
                              button = buttons.nth(i)

                              if visible(button):
                                  print(
                                      "\nCLICKING CABIN BUTTON:",
                                      name
                                  )

                                  button.click(
                                      force=True
                                  )

                                  time.sleep(5)

                                  return True
                      except Exception:
                          pass

              return False


          def inspect_date(page):
              print(
                  "\n========== DATE INSPECTION ==========\n"
              )

              for frame_number, frame in enumerate(
                  all_frames(page)
              ):
                  try:
                      inputs = frame.locator(
                          "input"
                      )

                      for i in range(
                          inputs.count()
                      ):
                          item = inputs.nth(i)

                          try:
                              if not visible(item):
                                  continue

                              value = item.input_value()

                              outer = item.evaluate(
                                  "(e) => e.outerHTML"
                              )

                              if (
                                  re.search(
                                      r"\\d{1,2}/\\d{1,2}/\\d{4}",
                                      value or ""
                                  )
                                  or
                                  "date" in (
                                      item.get_attribute(
                                          "type"
                                      ) or ""
                                  ).lower()
                              ):
                                  print(
                                      f"\nFRAME {frame_number}"
                                  )

                                  print(
                                      "VALUE:",
                                      value
                                  )

                                  print(
                                      "OUTERHTML:"
                                  )

                                  print(
                                      outer
                                  )

                                  try:
                                      parent = item.evaluate(
                                          "(e) => e.parentElement.outerHTML"
                                      )

                                      print(
                                          "\nPARENT HTML:"
                                      )

                                      print(
                                          parent[:15000]
                                      )
                                  except Exception:
                                      pass

                          except Exception:
                              pass

                  except Exception:
                      pass


          def check_route(
              page,
              from_port,
              to_port
          ):
              print(
                  "\n\n======================================"
              )

              print(
                  f"ROUTE: {from_port} -> {to_port}"
              )

              print(
                  "======================================\n"
              )

              page.goto(
                  URL,
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              page.wait_for_timeout(7000)

              remove_cookie_overlay(page)

              select_port(
                  page,
                  from_port,
                  "from"
              )

              select_port(
                  page,
                  to_port,
                  "to"
              )

              print(
                  "\nPORTS SELECTED:"
              )

              print(
                  from_port,
                  "->",
                  to_port
              )

              inspect_date(page)

              dump_dom(page)

              try_cabin_button(page)

              page.wait_for_timeout(5000)

              print(
                  "\nCURRENT URL:"
              )

              print(
                  page.url
              )

              inspect_date(page)

              dump_dom(page)


          def main():
              with sync_playwright() as p:

                  browser = p.chromium.launch(
                      headless=True
                  )

                  context = browser.new_context(
                      viewport={
                          "width": 1440,
                          "height": 1200
                      },
                      locale="en-GB",
                      timezone_id="Europe/Oslo"
                  )

                  page = context.new_page()

                  requests, responses = (
                      install_network_logging(page)
                  )

                  for from_port, to_port in ROUTES:
                      try:
                          check_route(
                              page,
                              from_port,
                              to_port
                          )

                      except Exception as e:
                          print(
                              "\nROUTE ERROR:"
                          )

                          print(
                              type(e).__name__
                              + ": "
                              + str(e)
                          )

                          try:
                              page.screenshot(
                                  path=(
                                      "error_"
                                      + from_port.replace(
                                          " ",
                                          "_"
                                      )
                                      + "_"
                                      + to_port.replace(
                                          " ",
                                          "_"
                                      )
                                      + ".png"
                                  ),
                                  full_page=True
                              )
                          except Exception:
                              pass

                  dump_requests(
                      requests,
                      responses
                  )

                  try:
                      page.screenshot(
                          path="final.png",
                          full_page=True
                      )
                  except Exception:
                      pass

                  try:
                      with open(
                          "final.html",
                          "w",
                          encoding="utf-8"
                      ) as f:
                          f.write(
                              page.content()
                          )
                  except Exception:
                      pass

                  browser.close()


          if __name__ == "__main__":
              main()
          PY

      - name: Run diagnostic monitor
        run: |
          python monitor.py

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hurtigruten-network-diagnostics
          path: |
            network.json
            final.html
            final.png
            error_*.png
            monitor.py
            responses/
          if-no-files-found: ignore
